<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesion</title>
<meta name="description" content="Sistema de inventario y ventas de la Tienda Comunal">

<!-- Meta para que al compartir el link se vea el logo y el nombre de la tienda -->
<meta property="og:type" content="website">
<meta property="og:title" content="TIENDA COMUNAL GC2026">
<meta property="og:description" content="Sistema de inventario y ventas de la Tienda Comunal">
<meta property="og:image" content="https://tienda-comunal.onrender.com/img/logoL.png">
<meta property="og:url" content="https://tienda-comunal.onrender.com/login">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="TIENDA COMUNAL GC2026">
<meta name="twitter:description" content="Sistema de inventario y ventas de la Tienda Comunal">
<meta name="twitter:image" content="https://tienda-comunal.onrender.com/img/logoL.png">

<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div class="login-page">
  <div class="login-fondo" aria-hidden="true">
    <span class="orbe orbe-1"></span>
    <span class="orbe orbe-2"></span>
  </div>

  <div class="login-wrap">
    <div class="login-card-grande" id="loginCard">
      <div class="login-imagen">
        <div class="abarrotes-flotantes" aria-hidden="true">
          <i class="bi bi-basket3 ab-1"></i>
          <i class="bi bi-bag-fill ab-2"></i>
          <i class="bi bi-cup-straw ab-3"></i>
          <i class="bi bi-egg-fried ab-4"></i>
          <i class="bi bi-box-seam ab-5"></i>
          <i class="bi bi-basket2 ab-6"></i>
        </div>
        <img src="img/controltienda.png" alt="Control de tienda" class="login-card-img">
      </div>

      <div class="login-form-col">
        <div class="login-form-header">
          <div class="ia-puntos-grupo" aria-hidden="true">
            <div class="brazo brazo-1"><span class="punto punto-celeste"></span></div>
            <div class="brazo brazo-2"><span class="punto punto-morado"></span></div>
            <div class="brazo brazo-3"><span class="punto punto-rosado"></span></div>
            <div class="brazo brazo-4"><span class="punto punto-celeste-opaco"></span></div>
          </div>
          <div>
            <h1>Iniciar sesión</h1>
            <p>Tienda Prueba</p>
          </div>
        </div>

        <div class="campo-subrayado">
          <label for="email">Usuario de Acceso</label>
          <div class="campo-icono">
            <i class="bi bi-person"></i>
            <input type="text" id="email" autocomplete="username" placeholder="Usuario de acceso" onkeydown="if(event.key==='Enter') login()">
          </div>
        </div>
        <div class="campo-subrayado">
          <label for="password">Contraseña</label>
          <div class="campo-icono">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" class="input-password" placeholder="••••••••"
                   onkeydown="if(event.key==='Enter') login()">
            <button type="button" class="toggle-password" onclick="togglePassword()" tabindex="-1" title="Mostrar/ocultar contrasena">
              <i class="bi bi-eye" id="iconoTogglePassword"></i>
            </button>
          </div>
        </div>

        <button id="btnLogin" onclick="login()">Iniciar sesion</button>
        <div id="loginMsg"></div>
      </div>
    </div>
  </div>
  <footer class="login-footer">
    <span>Derechos Reservados ©2026</span>
    <a href="https://ceroxnueve.com/" target="_blank">Powered By: <strong>CERO NUEVE</strong></a>
  </footer>
</div>

<script src="dashboard.js"></script>
<script>
// Si ya hay sesion, no tiene sentido mostrar el login de nuevo
if (getToken()) {
  window.location.href = "dashboard";
}

// Si llegamos aca porque cerrarSesionPorTokenInvalido() nos mando (token
// vencido/invalido a mitad de uso), mostramos el porque en vez de dejar
// que parezca un login normal sin explicacion.
const mensajePendiente = localStorage.getItem("mensajeLogin");
if (mensajePendiente) {
  document.getElementById("loginMsg").innerHTML = `<div class="msg error"><i class="bi bi-exclamation-circle-fill"></i><span>${mensajePendiente}</span></div>`;
  localStorage.removeItem("mensajeLogin");
}

function togglePassword() {
  const input = document.getElementById("password");
  const icono = document.getElementById("iconoTogglePassword");
  const mostrando = input.type === "text";
  input.type = mostrando ? "password" : "text";
  icono.className = mostrando ? "bi bi-eye" : "bi bi-eye-slash";
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msgDiv = document.getElementById("loginMsg");
  const btn = document.getElementById("btnLogin");
  const textoOriginal = btn.innerHTML;

  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Ingresando...';

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) throw new Error((await res.json()).mensaje || "Error al iniciar sesion");

    const data = await res.json();
    localStorage.setItem("token", data.token);
    localStorage.setItem("nombre", data.nombre || "");
    localStorage.setItem("roles", JSON.stringify(data.roles || []));
    window.location.href = "dashboard";
  } catch (e) {
    msgDiv.innerHTML = `<div class="msg error"><i class="bi bi-exclamation-circle-fill"></i><span>${e.message}</span></div>`;
    btn.disabled = false;
    btn.innerHTML = textoOriginal;
  }
}
</script>

</body>
</html>
