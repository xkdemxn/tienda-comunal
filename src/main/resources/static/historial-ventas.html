<script src="dashboard.js"></script>
<script>
initSidebar("historial-ventas");

function hoyISO() {
  return fechaLocalISO(new Date());
}

function prepararFechasHistorial() {
  const desde = document.getElementById("histDesde");
  const hasta = document.getElementById("histHasta");
  if (!hasta.value) hasta.value = hoyISO();
  if (!desde.value) desde.value = hoyISO();
}

function formatoFechaLarga(fechaIso) {
  return new Date(fechaIso).toLocaleDateString("es", {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });
}

function formatoHora(fechaIso) {
  return new Date(fechaIso).toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
}

function formatoFechaCorta(fechaIso) {
  return new Date(fechaIso + "T00:00:00").toLocaleDateString("es", { day: "2-digit", month: "short" });
}

async function cargarHistorial() {
  prepararFechasHistorial();
  const desde = `${document.getElementById("histDesde").value}T00:00:00`;
  const hasta = `${document.getElementById("histHasta").value}T23:59:59`;
  const div = document.getElementById("histResultado");
  div.innerHTML = `<p style="color:var(--muted)">Cargando...</p>`;

  try {
    const ventas = await apiFetch(`/ventas?desde=${desde}&hasta=${hasta}`);

    if (ventas.length === 0) {
      div.innerHTML = `<div class="card"><div class="estado-vacio"><i class="bi bi-receipt"></i>Sin ventas en este rango</div></div>`;
      return;
    }

    // Agrupar por dia (la API ya devuelve mas recientes primero)
    const porDia = new Map();
    ventas.forEach(v => {
      const dia = v.fecha.slice(0, 10);
      if (!porDia.has(dia)) porDia.set(dia, []);
      porDia.get(dia).push(v);
    });

    const totalGeneral = ventas.reduce((acc, v) => acc + Number(v.totalMonedaLocal), 0);
    let html = `
      <div class="card" style="display:flex; align-items:center; gap:14px">
        <div class="nav-icono g-verde" style="width:46px; height:46px; font-size:20px; border-radius:14px">
          <i class="bi bi-cash-coin"></i>
        </div>
        <div>
          <div style="font-size:12px; color:var(--muted)">Total del periodo · ${ventas.length} venta${ventas.length === 1 ? "" : "s"}</div>
          <strong style="font-size:26px; color:var(--accent)">$${totalGeneral.toFixed(2)}</strong>
        </div>
      </div>`;

    if (porDia.size > 1) {
      html += `
        <div class="card">
          <h2><i class="bi bi-bar-chart-line"></i> Ventas por dia</h2>
          <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:center">
            <canvas id="graficoPorDia" width="200" height="200" style="flex-shrink:0"></canvas>
            <div id="leyendaPorDia" style="flex:1; min-width:180px"></div>
          </div>
        </div>`;
    }

    porDia.forEach((ventasDelDia, dia) => {
      const totalDia = ventasDelDia.reduce((acc, v) => acc + Number(v.totalMonedaLocal), 0);
      html += `
        <div class="card">
          <div class="item" style="border-bottom:none">
            <div><strong>${formatoFechaLarga(dia + "T00:00:00")}</strong>
              <small>${ventasDelDia.length} venta${ventasDelDia.length === 1 ? "" : "s"}</small>
            </div>
            <strong>$${totalDia.toFixed(2)}</strong>
          </div>`;

      ventasDelDia.forEach(v => {
        const items = v.detalles.map(d =>
          d.peso ? `${d.producto} (${d.peso} lb)` : `${d.producto} x${d.cantidad}`
        ).join(", ");
        html += `
          <div class="transaccion">
            <div class="transaccion-icono"><i class="bi bi-receipt"></i></div>
            <div class="transaccion-info">
              <strong class="hora-venta">${formatoHora(v.fecha)}</strong>
              <small>${items}</small>
            </div>
            <div class="transaccion-monto">$${Number(v.totalMonedaLocal).toFixed(2)}</div>
          </div>`;
      });

      html += `</div>`;
    });

    div.innerHTML = html;

    if (porDia.size > 1) {
      const datosGrafico = Array.from(porDia.entries()).map(([dia, ventasDelDia]) => ({
        label: formatoFechaCorta(dia),
        valor: ventasDelDia.reduce((acc, v) => acc + Number(v.totalMonedaLocal), 0)
      }));
      dibujarGraficoPastel("graficoPorDia", datosGrafico, "leyendaPorDia",
        v => `$${Number(v).toFixed(2)}`);
    }
  } catch (e) {
    div.innerHTML = `<div class="msg error">${e.message}</div>`;
  }
}

cargarHistorial();
</script>
