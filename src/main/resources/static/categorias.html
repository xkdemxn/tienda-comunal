<!DOCTYPE html>

<meta charset="UTF-8">

  <div id="fondoSidebarMovil" class="fondo-sidebar-movil"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header"><i class="bi bi-shop"></i> Tienda</div>
    <nav class="sidebar-nav">
      <a href="dashboard" data-pagina="inicio"><span class="nav-icono g-azul"><i class="bi bi-house-door"></i></span><span class="nav-texto">Inicio</span></a>
      <a href="venta" data-pagina="venta"><span class="nav-icono g-verde"><i class="bi bi-cart3"></i></span><span class="nav-texto">Vender</span></a>
      <a href="agregar-stock" data-pagina="agregar-stock"><span class="nav-icono g-cian"><i class="bi bi-plus-circle"></i></span><span class="nav-texto">Agregar stock</span></a>
      <a href="deudores" data-pagina="deudores"><span class="nav-icono g-rosa"><i class="bi bi-people"></i></span><span class="nav-texto">Fiar</span></a>
      <a href="historial-ventas" data-pagina="historial-ventas"><span class="nav-icono g-naranja"><i class="bi bi-clock-history"></i></span><span class="nav-texto">Historial de ventas</span></a>

      <button class="grupo-toggle" data-grupo="catalogo" data-solo-admin="1" onclick="toggleGrupo('catalogo')">
        <span class="nav-icono g-morado"><i class="bi bi-grid"></i></span><span class="nav-texto">Catalogo</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-catalogo" data-grupo="catalogo">
        <a href="categorias" data-pagina="categorias" data-solo-admin="1"><span class="nav-icono g-morado"><i class="bi bi-tags"></i></span><span class="nav-texto">Categorias</span></a>
        <a href="productos" data-pagina="productos" data-solo-admin="1"><span class="nav-icono g-teal"><i class="bi bi-box-seam"></i></span><span class="nav-texto">Productos</span></a>
      </div>

      <button class="grupo-toggle" data-grupo="abastecimiento" data-solo-admin="1" onclick="toggleGrupo('abastecimiento')">
        <span class="nav-icono g-indigo"><i class="bi bi-truck"></i></span><span class="nav-texto">Abastecimiento</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-abastecimiento" data-grupo="abastecimiento">
        <a href="proveedores" data-pagina="proveedores" data-solo-admin="1"><span class="nav-icono g-indigo"><i class="bi bi-truck"></i></span><span class="nav-texto">Proveedores</span></a>
        <a href="compras" data-pagina="compras" data-solo-admin="1"><span class="nav-icono g-ambar"><i class="bi bi-receipt"></i></span><span class="nav-texto">Compras</span></a>
        <a href="caducados" data-pagina="caducados" data-solo-admin="1"><span class="nav-icono g-rojo"><i class="bi bi-exclamation-triangle"></i></span><span class="nav-texto">Caducados</span></a>
      </div>

      <button class="grupo-toggle" data-grupo="reportes" data-solo-admin="1" onclick="toggleGrupo('reportes')">
        <span class="nav-icono g-azul"><i class="bi bi-graph-up"></i></span><span class="nav-texto">Reportes</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-reportes" data-grupo="reportes">
        <a href="estadisticas" data-pagina="estadisticas" data-solo-admin="1"><span class="nav-icono g-azul"><i class="bi bi-bar-chart-line"></i></span><span class="nav-texto">Estadisticas</span></a>
        <a href="fiscalizacion" data-pagina="fiscalizacion" data-solo-admin="1"><span class="nav-icono g-violeta"><i class="bi bi-clipboard-data"></i></span><span class="nav-texto">Fiscalizacion</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="perfil-mini">
        <span class="avatar-mini" id="sidebarAvatar">?</span>
        <div class="perfil-mini-textos">
          <div class="nombre" id="sidebarNombre"></div>
          <div class="rol" id="sidebarRol"></div>
        </div>
      </div>
      <button onclick="logout()"><i class="bi bi-box-arrow-right"></i> Cerrar sesion</button>
    </div>
  </aside>

  <div class="contenido">
    <div class="topbar">
      <button id="btnHamburguesa" class="btn-hamburguesa"><i class="bi bi-list"></i></button>
      <h1>Categorias</h1>
    </div>
    <div class="pagina">

      <div class="card">
        <h2><i class="bi bi-folder-plus"></i> Nueva categoria</h2>
        <input type="text" id="nuevaCategoriaNombre" placeholder="Ej: Lacteos">
        <input type="text" id="nuevaCategoriaDescripcion" placeholder="Descripcion (opcional)">
        <button onclick="crearCategoria()">Agregar categoria</button>
      </div>

      <div class="card">
        <div id="mensajeCategorias"></div>
        <div id="listaCategorias">Cargando categorias...</div>
      </div>

    </div>
  </div>
</div>

<!-- Modal para editar el nombre/descripcion de una categoria -->
<div id="modalEditarCategoriaFondo" class="modal-fondo oculto" onclick="cerrarModalEditarCategoriaSiFondo(event)">
  <div class="modal" style="text-align:left">
    <h2><i class="bi bi-pencil-square"></i> Editar categoria</h2>
    <label class="campo">Nombre</label>
    <input type="text" id="editCategoriaNombre">
    <label class="campo">Descripcion (opcional)</label>
    <input type="text" id="editCategoriaDescripcion">
    <button onclick="guardarEdicionCategoria()">Guardar cambios</button>
    <button class="secundario" onclick="cerrarModalEditarCategoria()">Cancelar</button>
  </div>
</div>

<nav class="barra-inferior">
  <a href="dashboard" data-pagina="inicio"><i class="bi bi-house-door"></i><span>Inicio</span></a>
  <a href="agregar-stock" data-pagina="agregar-stock"><i class="bi bi-plus-circle"></i><span>Stock</span></a>
  <a href="venta" data-pagina="venta" class="accion-principal"><i class="bi bi-cart3"></i></a>
  <a href="deudores" data-pagina="deudores"><i class="bi bi-people"></i><span>Fiar</span></a>
  <button type="button" id="btnMasMovil"><i class="bi bi-grid-3x3-gap"></i><span>Mas</span></button>
</nav>

<script src="dashboard.js"></script>
<script>
initSidebar("categorias");

let categorias = [];

async function cargarCategorias() {
  const div = document.getElementById("listaCategorias");
  try {
    categorias = await apiFetch("/categorias");
    renderCategorias();
  } catch (e) {
    div.innerHTML = `<div class="msg error"><i class="bi bi-exclamation-circle-fill"></i><span>${e.message}</span></div>`;
  }
}

function renderCategorias() {
  const div = document.getElementById("listaCategorias");
  if (categorias.length === 0) {
    div.innerHTML = `<div class="estado-vacio"><i class="bi bi-folder2"></i>Sin categorias todavia</div>`;
    return;
  }
  div.innerHTML = "";
  categorias.forEach(c => {
    div.innerHTML += `
      <div class="item">
        <div style="display:flex; align-items:center; gap:10px">
          <span class="nav-icono g-morado" style="width:34px; height:34px; font-size:15px; border-radius:10px"><i class="bi bi-folder2"></i></span>
          <div>${c.nombre}<small>${c.descripcion || ""}</small></div>
        </div>
        <div class="item-acciones">
          <button onclick="verProductosDeCategoria(${c.id})">Ver productos</button>
          <button class="secundario" onclick="abrirEditarCategoria(${c.id})">Editar</button>
          <button class="secundario" onclick="eliminarCategoria(${c.id})">Eliminar</button>
        </div>
      </div>`;
  });
}

function verProductosDeCategoria(id) {
  window.location.href = `productos?categoria=${id}`;
}

// ---------- EDITAR CATEGORIA ----------
let categoriaEditandoId = null;

function abrirEditarCategoria(id) {
  const c = categorias.find(x => x.id === id);
  if (!c) return;
  categoriaEditandoId = id;
  document.getElementById("editCategoriaNombre").value = c.nombre;
  document.getElementById("editCategoriaDescripcion").value = c.descripcion || "";
  document.getElementById("modalEditarCategoriaFondo").classList.remove("oculto");
}

function cerrarModalEditarCategoria() {
  document.getElementById("modalEditarCategoriaFondo").classList.add("oculto");
  categoriaEditandoId = null;
}

function cerrarModalEditarCategoriaSiFondo(event) {
  if (event.target.id === "modalEditarCategoriaFondo") cerrarModalEditarCategoria();
}

async function guardarEdicionCategoria() {
  const nombre = document.getElementById("editCategoriaNombre").value.trim();
  const descripcion = document.getElementById("editCategoriaDescripcion").value.trim();

  if (!nombre) {
    mostrarMensajeEn("mensajeCategorias", "Falta el nombre de la categoria", "error");
    return;
  }

  try {
    await apiFetch(`/categorias/${categoriaEditandoId}`, {
      method: "PUT",
      body: JSON.stringify({ nombre, descripcion: descripcion || null })
    });
    mostrarMensajeEn("mensajeCategorias", "Categoria actualizada", "ok");
    cerrarModalEditarCategoria();
    await cargarCategorias();
  } catch (e) {
    mostrarMensajeEn("mensajeCategorias", e.message, "error");
  }
}

async function crearCategoria() {
  const nombre = document.getElementById("nuevaCategoriaNombre").value.trim();
  const descripcion = document.getElementById("nuevaCategoriaDescripcion").value.trim();

  if (!nombre) {
    mostrarMensajeEn("mensajeCategorias", "Falta el nombre de la categoria", "error");
    return;
  }

  try {
    await apiFetch("/categorias", {
      method: "POST",
      body: JSON.stringify({ nombre, descripcion: descripcion || null })
    });
    document.getElementById("nuevaCategoriaNombre").value = "";
    document.getElementById("nuevaCategoriaDescripcion").value = "";
    mostrarMensajeEn("mensajeCategorias", "Categoria creada", "ok");
    await cargarCategorias();
  } catch (e) {
    mostrarMensajeEn("mensajeCategorias", e.message, "error");
  }
}

async function eliminarCategoria(id) {
  if (!confirm("¿Eliminar esta categoria? Si algun producto la esta usando, no se va a poder eliminar hasta que le cambies la categoria.")) return;

  try {
    await apiFetch(`/categorias/${id}`, { method: "DELETE" });
    mostrarMensajeEn("mensajeCategorias", "Categoria eliminada", "ok");
    await cargarCategorias();
  } catch (e) {
    mostrarMensajeEn("mensajeCategorias", e.message, "error");
  }
}

cargarCategorias();
</script>

</body>
</html>
