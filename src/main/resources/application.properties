# =========================================
# Configuracion de la base de datos (PostgreSQL)
# En Render estas variables se inyectan automaticamente
# si defines la variable de entorno con esos nombres exactos
# apuntando a las que crea la base de datos PostgreSQL de Render.
# =========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tienda_inventario}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Puerto (Railway inyecta PORT automaticamente)
server.port=${PORT:8080}

# Tomcat por defecto reserva hasta 200 threads (cada uno con su propio stack
# de memoria) pensando en trafico grande - para una sola tienda con unos
# pocos cajeros usando la app a la vez, eso es memoria reservada de mas sin
# necesidad. 20 alcanza de sobra.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# Igual con el pool de conexiones a la base (HikariCP): el default es 10,
# demasiado para el trafico real de la tienda.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JWT
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-muy-larga-y-secreta-en-produccion-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Clave maestra para suspender/reactivar el servicio (PUT /api/sistema/suscripcion).
# Definila como variable de entorno CLAVE_MAESTRA en Render (no la dejes con el
# valor por defecto en produccion) y guardala solo vos, aparte del repositorio.
app.clave-maestra=${CLAVE_MAESTRA:xkDEMON1811}

# Tasa de cambio (API externa)
app.exchangerate.api-url=${EXCHANGE_API_URL:https://api.exchangerate-api.com/v4/latest/USD}
app.exchangerate.moneda-base=${MONEDA_BASE:USD}

# Nombre app
spring.application.name=inventario

# Arranque perezoso: crea los beans solo cuando se necesitan por primera vez,
# en vez de todos al inicio. Reduce bastante el tiempo de arranque en hosts
# con poco CPU (como el plan gratuito de Render), donde el health check
# puede matar la instancia si tarda demasiado en levantar.
spring.main.lazy-initialization=true

# Manejo de errores mas limpio
server.error.include-message=always
server.error.include-binding-errors=always

# Los .html/.js/.css del frontend siempre se revalidan contra el servidor antes
# de usar la copia en cache del navegador (evita ver una version vieja despues
# de un deploy nuevo; si el archivo no cambio, el servidor igual responde 304
# rapido, asi que no se pierde el beneficio de la cache).
spring.web.resources.cache.cachecontrol.no-cache=true
