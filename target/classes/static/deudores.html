<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deudores</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  .resultados-busqueda .item button {
    width: auto;
    padding: 8px 12px;
    margin-bottom: 0;
  }
  .total {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: 700;
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="app">
  <div id="fondoSidebarMovil" class="fondo-sidebar-movil"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header"><i class="bi bi-shop"></i> Tienda</div>
    <nav class="sidebar-nav">
      <a href="dashboard" data-pagina="inicio">Inicio</a>
      <a href="venta" data-pagina="venta">Vender</a>
      <a href="agregar-stock" data-pagina="agregar-stock">Agregar stock</a>
      <a href="deudores" data-pagina="deudores">Fiar</a>
      <a href="historial-ventas" data-pagina="historial-ventas">Historial de ventas</a>

      <button class="grupo-toggle" data-grupo="catalogo" data-solo-admin="1" onclick="toggleGrupo('catalogo')">
        <span>Catalogo</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-catalogo" data-grupo="catalogo">
        <a href="categorias" data-pagina="categorias" data-solo-admin="1">Categorias</a>
        <a href="productos" data-pagina="productos" data-solo-admin="1">Productos</a>
      </div>

      <button class="grupo-toggle" data-grupo="abastecimiento" data-solo-admin="1" onclick="toggleGrupo('abastecimiento')">
        <span>Abastecimiento</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-abastecimiento" data-grupo="abastecimiento">
        <a href="proveedores" data-pagina="proveedores" data-solo-admin="1">Proveedores</a>
        <a href="compras" data-pagina="compras" data-solo-admin="1">Compras</a>
        <a href="caducados" data-pagina="caducados" data-solo-admin="1">Caducados</a>
      </div>

      <button class="grupo-toggle" data-grupo="reportes" data-solo-admin="1" onclick="toggleGrupo('reportes')">
        <span>Reportes</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-reportes" data-grupo="reportes">
        <a href="estadisticas" data-pagina="estadisticas" data-solo-admin="1">Estadisticas</a>
        <a href="fiscalizacion" data-pagina="fiscalizacion" data-solo-admin="1">Fiscalizacion</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="nombre" id="sidebarNombre"></div>
      <div class="rol" id="sidebarRol"></div>
      <button onclick="logout()">Cerrar sesion</button>
    </div>
  </aside>

  <div class="contenido">
    <div class="topbar">
      <button id="btnHamburguesa" class="btn-hamburguesa"><i class="bi bi-list"></i></button>
      <h1>Deudores</h1>
    </div>
    <div class="pagina">

      <div class="card">
        <div class="item" style="border-bottom:none">
          <div>Deuda total pendiente</div>
          <strong id="deudaTotalGeneral" class="total-general">$0.00</strong>
        </div>
      </div>

      <div class="card">
        <h2>Nuevo deudor</h2>
        <input type="text" id="nuevoNombre" placeholder="Nombre">
        <input type="text" id="nuevoTelefono" placeholder="Telefono (opcional)">
        <button onclick="crearDeudor()">Agregar deudor</button>
      </div>

      <div class="card">
        <div id="mensajeDeudores"></div>
        <div id="listaDeudores">Cargando deudores...</div>
      </div>

    </div>
  </div>
</div>

<!-- Modal Fiar: elige productos del stock, como una venta pero sin cobrar -->
<div id="modalFiarFondo" class="modal-fondo oculto" onclick="cerrarModalFiarSiFondo(event)">
  <div class="modal" style="text-align:left; max-width:420px">
    <h2 id="modalFiarTitulo">Fiar</h2>

    <label class="campo">Buscar producto</label>
    <input type="text" id="buscarProductoFiar" placeholder="Buscar por nombre..." oninput="buscarProductoParaFiar()">
    <div id="resultadosBusquedaFiar" class="resultados-busqueda"></div>

    <div id="carritoFiar"></div>
    <div class="total">
      <span>Total</span>
      <span id="totalFiar">$0.00</span>
    </div>

    <button onclick="confirmarFiadoProductos()">Confirmar fiado</button>
    <button class="secundario" onclick="cerrarModalFiar()">Cancelar</button>

    <p style="text-align:center; margin:10px 0 0">
      <a href="#" onclick="mostrarFiadoManual(event)" style="font-size:12px; color:var(--muted)">
        ¿Fiar un monto sin elegir productos?
      </a>
    </p>
    <div id="fiadoManualBloque" class="oculto" style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px">
      <label class="campo">Monto</label>
      <input type="number" min="0.01" step="0.01" id="fiadoManualMonto" placeholder="0.00">
      <label class="campo">Detalle (opcional)</label>
      <input type="text" id="fiadoManualDescripcion" placeholder="Ej: vuelto fiado">
      <button class="secundario" onclick="confirmarFiadoManual()">Confirmar monto manual</button>
    </div>
  </div>
</div>

<!-- Modal Abonar -->
<div id="modalAbonoFondo" class="modal-fondo oculto" onclick="cerrarModalAbonoSiFondo(event)">
  <div class="modal" style="text-align:left">
    <h2 id="modalAbonoTitulo">Abonar</h2>
    <label class="campo">Monto</label>
    <input type="number" min="0.01" step="0.01" id="abonoMonto" placeholder="0.00">
    <label class="campo">Detalle (opcional)</label>
    <input type="text" id="abonoDescripcion" placeholder="Ej: pago parcial">
    <button onclick="confirmarAbono()">Confirmar</button>
    <button class="secundario" onclick="cerrarModalAbono()">Cancelar</button>
  </div>
</div>

<!-- Modal historial -->
<div id="modalHistorialFondo" class="modal-fondo oculto" onclick="cerrarModalHistorialSiFondo(event)">
  <div class="modal" style="text-align:left; max-width:420px">
    <h2 id="modalHistorialTitulo">Historial</h2>
    <div id="listaHistorial" style="max-height:50vh; overflow-y:auto"></div>
    <button class="secundario" onclick="cerrarModalHistorial()">Cerrar</button>
  </div>
</div>

<script src="dashboard.js"></script>
<script>
initSidebar("deudores");

let deudores = [];

async function cargarDeudores() {
  const div = document.getElementById("listaDeudores");
  try {
    deudores = await apiFetch("/deudores");
    renderDeudores();
  } catch (e) {
    div.innerHTML = `<div class="msg error">${e.message}</div>`;
  }
}

function renderDeudores() {
  const div = document.getElementById("listaDeudores");
  const totalGeneral = deudores.reduce((acc, d) => acc + Number(d.saldoActual), 0);
  document.getElementById("deudaTotalGeneral").innerText = `$${totalGeneral.toFixed(2)}`;

  if (deudores.length === 0) {
    div.innerHTML = `<p style="color:var(--muted)">Sin deudores todavia</p>`;
    return;
  }

  div.innerHTML = "";
  deudores.forEach(d => {
    const saldo = Number(d.saldoActual);
    const badgeClase = saldo > 0 ? "bajo" : "ok";
    div.innerHTML += `
      <div class="item">
        <div>
          ${d.nombre}
          <small>${d.telefono || "Sin telefono"}</small>
        </div>
        <div class="item-acciones">
          <span class="badge ${badgeClase}">$${saldo.toFixed(2)}</span>
          <button onclick="abrirModalFiar(${d.id})">Fiar</button>
          <button class="secundario" onclick="abrirModalAbono(${d.id})">Abonar</button>
          <button class="secundario" onclick="abrirHistorial(${d.id})">Historial</button>
          <button class="secundario" onclick="eliminarDeudor(${d.id})">Eliminar</button>
        </div>
      </div>`;
  });
}

async function crearDeudor() {
  const nombre = document.getElementById("nuevoNombre").value.trim();
  const telefono = document.getElementById("nuevoTelefono").value.trim();

  if (!nombre) {
    mostrarMensajeEn("mensajeDeudores", "Falta el nombre del deudor", "error");
    return;
  }

  try {
    await apiFetch("/deudores", {
      method: "POST",
      body: JSON.stringify({ nombre, telefono: telefono || null })
    });
    document.getElementById("nuevoNombre").value = "";
    document.getElementById("nuevoTelefono").value = "";
    mostrarMensajeEn("mensajeDeudores", "Deudor agregado", "ok");
    await cargarDeudores();
  } catch (e) {
    mostrarMensajeEn("mensajeDeudores", e.message, "error");
  }
}

async function eliminarDeudor(id) {
  if (!confirm("¿Eliminar este deudor de la lista?")) return;
  try {
    await apiFetch(`/deudores/${id}`, { method: "DELETE" });
    mostrarMensajeEn("mensajeDeudores", "Deudor eliminado", "ok");
    await cargarDeudores();
  } catch (e) {
    mostrarMensajeEn("mensajeDeudores", e.message, "error");
  }
}

// ---------- FIAR (elegir productos del stock) ----------
let deudorFiarId = null;
let carritoFiar = []; // { codigoBarras, nombre, precio, cantidad }
let temporizadorBusquedaFiar;

function abrirModalFiar(deudorId) {
  deudorFiarId = deudorId;
  const deudor = deudores.find(d => d.id === deudorId);
  document.getElementById("modalFiarTitulo").innerText = `Fiar a ${deudor.nombre}`;
  carritoFiar = [];
  renderCarritoFiar();
  document.getElementById("buscarProductoFiar").value = "";
  document.getElementById("resultadosBusquedaFiar").innerHTML = "";
  document.getElementById("fiadoManualBloque").classList.add("oculto");
  document.getElementById("fiadoManualMonto").value = "";
  document.getElementById("fiadoManualDescripcion").value = "";
  document.getElementById("modalFiarFondo").classList.remove("oculto");
}

function cerrarModalFiar() {
  document.getElementById("modalFiarFondo").classList.add("oculto");
  deudorFiarId = null;
}

function cerrarModalFiarSiFondo(event) {
  if (event.target.id === "modalFiarFondo") cerrarModalFiar();
}

function mostrarFiadoManual(event) {
  event.preventDefault();
  document.getElementById("fiadoManualBloque").classList.toggle("oculto");
}

function buscarProductoParaFiar() {
  clearTimeout(temporizadorBusquedaFiar);
  const texto = document.getElementById("buscarProductoFiar").value.trim();
  const div = document.getElementById("resultadosBusquedaFiar");

  if (texto.length < 2) {
    div.innerHTML = "";
    return;
  }

  temporizadorBusquedaFiar = setTimeout(async () => {
    try {
      const productos = await apiFetch(`/productos/buscar?nombre=${encodeURIComponent(texto)}`);
      if (productos.length === 0) {
        div.innerHTML = `<p style="color:var(--muted); font-size:13px; margin:8px 0 0">Sin resultados</p>`;
        return;
      }
      div.innerHTML = "";
      productos.forEach(p => {
        div.innerHTML += `
          <div class="item">
            <div>${p.nombre}<small>Stock: ${p.stockActual} · $${Number(p.precioVenta).toFixed(2)}</small></div>
            <button onclick="agregarProductoAlFiado(${p.id})">Agregar</button>
          </div>`;
      });
      window.__resultadosBusquedaFiar = productos;
    } catch (e) {
      div.innerHTML = `<div class="msg error">${e.message}</div>`;
    }
  }, 300);
}

function agregarProductoAlFiado(id) {
  const producto = (window.__resultadosBusquedaFiar || []).find(p => p.id === id);
  if (!producto) return;

  const existente = carritoFiar.find(i => i.codigoBarras === producto.codigoBarras);
  if (existente) {
    existente.cantidad += 1;
  } else {
    carritoFiar.push({
      codigoBarras: producto.codigoBarras,
      nombre: producto.nombre,
      precio: producto.precioVenta,
      cantidad: 1
    });
  }
  document.getElementById("buscarProductoFiar").value = "";
  document.getElementById("resultadosBusquedaFiar").innerHTML = "";
  renderCarritoFiar();
}

function renderCarritoFiar() {
  const div = document.getElementById("carritoFiar");
  let total = 0;
  div.innerHTML = "";
  carritoFiar.forEach((item, idx) => {
    const subtotal = item.precio * item.cantidad;
    total += subtotal;
    div.innerHTML += `
      <div class="item">
        <div>
          ${item.nombre}
          <small>$${Number(item.precio).toFixed(2)} c/u</small>
        </div>
        <div style="display:flex; align-items:center; gap:8px">
          <input type="number" min="1" value="${item.cantidad}" style="width:55px; margin-bottom:0"
                 onchange="actualizarCantidadFiado(${idx}, this.value)">
          <span>$${subtotal.toFixed(2)}</span>
          <button class="secundario" style="width:auto; padding:4px 8px"
                  onclick="quitarDelFiado(${idx})"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>`;
  });
  document.getElementById("totalFiar").innerText = `$${total.toFixed(2)}`;
}

function actualizarCantidadFiado(idx, valor) {
  const cantidad = parseInt(valor, 10);
  if (!cantidad || cantidad < 1) {
    renderCarritoFiar();
    return;
  }
  carritoFiar[idx].cantidad = cantidad;
  renderCarritoFiar();
}

function quitarDelFiado(idx) {
  carritoFiar.splice(idx, 1);
  renderCarritoFiar();
}

async function confirmarFiadoProductos() {
  if (carritoFiar.length === 0) {
    mostrarMensajeEn("mensajeDeudores", "Agrega al menos un producto (o usa el monto manual)", "error");
    return;
  }
  try {
    await apiFetch(`/deudores/${deudorFiarId}/fiado-productos`, {
      method: "POST",
      body: JSON.stringify({
        items: carritoFiar.map(i => ({ codigoBarras: i.codigoBarras, cantidad: i.cantidad }))
      })
    });
    mostrarMensajeEn("mensajeDeudores", "Fiado registrado", "ok");
    cerrarModalFiar();
    await cargarDeudores();
  } catch (e) {
    mostrarMensajeEn("mensajeDeudores", e.message, "error");
  }
}

async function confirmarFiadoManual() {
  const monto = parseFloat(document.getElementById("fiadoManualMonto").value);
  const descripcion = document.getElementById("fiadoManualDescripcion").value.trim();

  if (!monto || monto <= 0) {
    mostrarMensajeEn("mensajeDeudores", "Ingresa un monto valido", "error");
    return;
  }

  try {
    await apiFetch(`/deudores/${deudorFiarId}/fiado`, {
      method: "POST",
      body: JSON.stringify({ monto, descripcion: descripcion || null })
    });
    mostrarMensajeEn("mensajeDeudores", "Fiado registrado", "ok");
    cerrarModalFiar();
    await cargarDeudores();
  } catch (e) {
    mostrarMensajeEn("mensajeDeudores", e.message, "error");
  }
}

// ---------- ABONAR ----------
let deudorAbonoId = null;

function abrirModalAbono(deudorId) {
  deudorAbonoId = deudorId;
  const deudor = deudores.find(d => d.id === deudorId);
  document.getElementById("modalAbonoTitulo").innerText = `Abonar de ${deudor.nombre}`;
  document.getElementById("abonoMonto").value = "";
  document.getElementById("abonoDescripcion").value = "";
  document.getElementById("modalAbonoFondo").classList.remove("oculto");
}

function cerrarModalAbono() {
  document.getElementById("modalAbonoFondo").classList.add("oculto");
  deudorAbonoId = null;
}

function cerrarModalAbonoSiFondo(event) {
  if (event.target.id === "modalAbonoFondo") cerrarModalAbono();
}

async function confirmarAbono() {
  const monto = parseFloat(document.getElementById("abonoMonto").value);
  const descripcion = document.getElementById("abonoDescripcion").value.trim();

  if (!monto || monto <= 0) {
    mostrarMensajeEn("mensajeDeudores", "Ingresa un monto valido", "error");
    return;
  }

  try {
    await apiFetch(`/deudores/${deudorAbonoId}/abono`, {
      method: "POST",
      body: JSON.stringify({ monto, descripcion: descripcion || null })
    });
    mostrarMensajeEn("mensajeDeudores", "Abono registrado", "ok");
    cerrarModalAbono();
    await cargarDeudores();
  } catch (e) {
    mostrarMensajeEn("mensajeDeudores", e.message, "error");
  }
}

// ---------- HISTORIAL ----------
async function abrirHistorial(deudorId) {
  const deudor = deudores.find(d => d.id === deudorId);
  document.getElementById("modalHistorialTitulo").innerText = `Historial de ${deudor.nombre}`;
  const div = document.getElementById("listaHistorial");
  div.innerHTML = `<p style="color:var(--muted)">Cargando...</p>`;
  document.getElementById("modalHistorialFondo").classList.remove("oculto");

  try {
    const movimientos = await apiFetch(`/deudores/${deudorId}/movimientos`);
    if (movimientos.length === 0) {
      div.innerHTML = `<p style="color:var(--muted)">Sin movimientos todavia</p>`;
      return;
    }
    div.innerHTML = "";
    movimientos.forEach(m => {
      const esFiado = m.tipo === "FIADO";
      const fecha = new Date(m.fecha).toLocaleString("es", {
        day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"
      });
      const detalleTexto = (m.detalles && m.detalles.length > 0)
        ? m.detalles.map(d => `${d.cantidad}x ${d.producto}`).join(", ")
        : (m.descripcion || "");
      div.innerHTML += `
        <div class="item">
          <div>
            ${esFiado ? "Fiado" : "Abono"}
            <small>${detalleTexto} · ${fecha}</small>
          </div>
          <strong style="color:${esFiado ? "#7f1d1d" : "#15803d"}">
            ${esFiado ? "+" : "-"}$${Number(m.monto).toFixed(2)}
          </strong>
        </div>`;
    });
  } catch (e) {
    div.innerHTML = `<div class="msg error">${e.message}</div>`;
  }
}

function cerrarModalHistorial() {
  document.getElementById("modalHistorialFondo").classList.add("oculto");
}

function cerrarModalHistorialSiFondo(event) {
  if (event.target.id === "modalHistorialFondo") cerrarModalHistorial();
}

cargarDeudores();
</script>

</body>
</html>
