<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compras</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div class="app">
  <div id="fondoSidebarMovil" class="fondo-sidebar-movil"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header"><i class="bi bi-shop"></i> Tienda</div>
    <nav class="sidebar-nav">
      <a href="dashboard" data-pagina="inicio"><span class="nav-icono g-azul"><i class="bi bi-house-door"></i></span><span class="nav-texto">Inicio</span></a>
      <a href="venta" data-pagina="venta"><span class="nav-icono g-verde"><i class="bi bi-cart3"></i></span><span class="nav-texto">Vender</span></a>
      <a href="agregar-stock" data-pagina="agregar-stock"><span class="nav-icono g-cian"><i class="bi bi-plus-circle"></i></span><span class="nav-texto">Agregar stock</span></a>
      <a href="deudores" data-pagina="deudores"><span class="nav-icono g-rosa"><i class="bi bi-people"></i></span><span class="nav-texto">Fiar</span></a>
      <a href="historial-ventas" data-pagina="historial-ventas"><span class="nav-icono g-naranja"><i class="bi bi-clock-history"></i></span><span class="nav-texto">Historial de ventas</span></a>

      <button class="grupo-toggle" data-grupo="catalogo" data-solo-admin="1" onclick="toggleGrupo('catalogo')">
        <span class="nav-icono g-morado"><i class="bi bi-grid"></i></span><span class="nav-texto">Catalogo</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-catalogo" data-grupo="catalogo">
        <a href="categorias" data-pagina="categorias" data-solo-admin="1"><span class="nav-icono g-morado"><i class="bi bi-tags"></i></span><span class="nav-texto">Categorias</span></a>
        <a href="productos" data-pagina="productos" data-solo-admin="1"><span class="nav-icono g-teal"><i class="bi bi-box-seam"></i></span><span class="nav-texto">Productos</span></a>
      </div>

      <button class="grupo-toggle" data-grupo="abastecimiento" data-solo-admin="1" onclick="toggleGrupo('abastecimiento')">
        <span class="nav-icono g-indigo"><i class="bi bi-truck"></i></span><span class="nav-texto">Abastecimiento</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-abastecimiento" data-grupo="abastecimiento">
        <a href="proveedores" data-pagina="proveedores" data-solo-admin="1"><span class="nav-icono g-indigo"><i class="bi bi-truck"></i></span><span class="nav-texto">Proveedores</span></a>
        <a href="compras" data-pagina="compras" data-solo-admin="1"><span class="nav-icono g-ambar"><i class="bi bi-receipt"></i></span><span class="nav-texto">Compras</span></a>
        <a href="caducados" data-pagina="caducados" data-solo-admin="1"><span class="nav-icono g-rojo"><i class="bi bi-exclamation-triangle"></i></span><span class="nav-texto">Caducados</span></a>
      </div>

      <button class="grupo-toggle" data-grupo="reportes" data-solo-admin="1" onclick="toggleGrupo('reportes')">
        <span class="nav-icono g-azul"><i class="bi bi-graph-up"></i></span><span class="nav-texto">Reportes</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-reportes" data-grupo="reportes">
        <a href="estadisticas" data-pagina="estadisticas" data-solo-admin="1"><span class="nav-icono g-azul"><i class="bi bi-bar-chart-line"></i></span><span class="nav-texto">Estadisticas</span></a>
        <a href="fiscalizacion" data-pagina="fiscalizacion" data-solo-admin="1"><span class="nav-icono g-violeta"><i class="bi bi-clipboard-data"></i></span><span class="nav-texto">Fiscalizacion</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="perfil-mini">
        <span class="avatar-mini" id="sidebarAvatar">?</span>
        <div class="perfil-mini-textos">
          <div class="nombre" id="sidebarNombre"></div>
          <div class="rol" id="sidebarRol"></div>
        </div>
      </div>
      <button onclick="logout()"><i class="bi bi-box-arrow-right"></i> Cerrar sesion</button>
    </div>
  </aside>

  <div class="contenido">
    <div class="topbar">
      <button id="btnHamburguesa" class="btn-hamburguesa"><i class="bi bi-list"></i></button>
      <h1>Compras</h1>
    </div>
    <div class="pagina">

      <div class="card">
        <h2><i class="bi bi-receipt"></i> Registrar compra a proveedor</h2>
        <label class="campo">Proveedor</label>
        <select id="proveedorId">
          <option value="">Selecciona un proveedor</option>
        </select>

        <label class="campo">Buscar producto para agregar</label>
        <input type="text" id="buscarProductoCompra" placeholder="Buscar por nombre..." oninput="buscarProductoCompra()">
        <div id="resultadosBusquedaCompra"></div>
      </div>

      <div class="card">
        <strong><i class="bi bi-cart-check"></i> Items de la compra</strong>
        <div id="itemsCompra"><div class="estado-vacio"><i class="bi bi-cart"></i>Sin items todavia</div></div>
        <div class="total">
          <span>Total</span>
          <span id="totalCompra">$0.00</span>
        </div>
        <div id="mensajeCompra"></div>
        <button onclick="confirmarCompra()">Registrar compra</button>
      </div>

      <div class="card">
        <h2><i class="bi bi-clock-history"></i> Historial de compras</h2>
        <div id="historialCompras">Cargando...</div>
      </div>

    </div>
  </div>
</div>

<nav class="barra-inferior">
  <a href="dashboard" data-pagina="inicio"><i class="bi bi-house-door"></i><span>Inicio</span></a>
  <a href="agregar-stock" data-pagina="agregar-stock"><i class="bi bi-plus-circle"></i><span>Stock</span></a>
  <a href="venta" data-pagina="venta" class="accion-principal"><i class="bi bi-cart3"></i></a>
  <a href="deudores" data-pagina="deudores"><i class="bi bi-people"></i><span>Fiar</span></a>
  <button type="button" id="btnMasMovil"><i class="bi bi-grid-3x3-gap"></i><span>Mas</span></button>
</nav>

<script src="dashboard.js"></script>
<script>
initSidebar("compras");

let carritoCompra = []; // { codigoBarras, nombre, cantidad, costoUnitario }
let temporizadorBusquedaCompra;
let resultadosBusqueda = [];

async function cargarProveedores() {
  try {
    const proveedores = await apiFetch("/proveedores");
    const select = document.getElementById("proveedorId");
    proveedores.forEach(p => {
      const opcion = document.createElement("option");
      opcion.value = p.id;
      opcion.innerText = p.nombre;
      select.appendChild(opcion);
    });
  } catch (e) {
    mostrarMensajeEn("mensajeCompra", "No se pudieron cargar los proveedores", "error");
  }
}

function buscarProductoCompra() {
  clearTimeout(temporizadorBusquedaCompra);
  const texto = document.getElementById("buscarProductoCompra").value.trim();
  const div = document.getElementById("resultadosBusquedaCompra");

  if (texto.length < 2) {
    div.innerHTML = "";
    return;
  }

  temporizadorBusquedaCompra = setTimeout(async () => {
    try {
      resultadosBusqueda = await apiFetch(`/productos/buscar?nombre=${encodeURIComponent(texto)}`);
      if (resultadosBusqueda.length === 0) {
        div.innerHTML = `<p style="color:var(--muted); font-size:13px">Sin resultados</p>`;
        return;
      }
      div.innerHTML = "";
      resultadosBusqueda.forEach(p => {
        div.innerHTML += `
          <div class="item">
            <div>${p.nombre}<small>Stock actual: ${p.stockActual}</small></div>
            <button onclick="agregarItemCompra(${p.id})">Agregar</button>
          </div>`;
      });
    } catch (e) {
      div.innerHTML = `<div class="msg error">${e.message}</div>`;
    }
  }, 300);
}

function agregarItemCompra(id) {
  const p = resultadosBusqueda.find(x => x.id === id);
  if (!p) return;

  const existente = carritoCompra.find(i => i.codigoBarras === p.codigoBarras);
  if (existente) {
    existente.cantidad += 1;
  } else {
    carritoCompra.push({
      codigoBarras: p.codigoBarras,
      nombre: p.nombre,
      cantidad: 1,
      costoUnitario: p.precioCompra || 0
    });
  }
  document.getElementById("buscarProductoCompra").value = "";
  document.getElementById("resultadosBusquedaCompra").innerHTML = "";
  renderCarritoCompra();
}

function actualizarItemCompra(idx, campo, valor) {
  const numero = parseFloat(valor);
  carritoCompra[idx][campo] = isNaN(numero) ? 0 : numero;
  renderCarritoCompra();
}

function quitarItemCompra(idx) {
  carritoCompra.splice(idx, 1);
  renderCarritoCompra();
}

function renderCarritoCompra() {
  const div = document.getElementById("itemsCompra");
  if (carritoCompra.length === 0) {
    div.innerHTML = `<div class="estado-vacio"><i class="bi bi-cart"></i>Sin items todavia</div>`;
    document.getElementById("totalCompra").innerText = "$0.00";
    return;
  }

  let total = 0;
  div.innerHTML = "";
  carritoCompra.forEach((item, idx) => {
    const subtotal = item.cantidad * item.costoUnitario;
    total += subtotal;
    div.innerHTML += `
      <div class="item">
        <div style="flex:1">
          ${item.nombre}
          <div style="display:flex; gap:6px; margin-top:6px">
            <input type="number" min="1" value="${item.cantidad}" style="margin-bottom:0"
                   onchange="actualizarItemCompra(${idx}, 'cantidad', this.value)">
            <input type="number" min="0" step="0.01" value="${item.costoUnitario}" style="margin-bottom:0"
                   onchange="actualizarItemCompra(${idx}, 'costoUnitario', this.value)">
          </div>
        </div>
        <div style="text-align:right">
          $${subtotal.toFixed(2)}
          <button class="secundario" style="width:auto; padding:4px 8px; margin-top:6px"
                  onclick="quitarItemCompra(${idx})"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>`;
  });
  document.getElementById("totalCompra").innerText = `$${total.toFixed(2)}`;
}

async function confirmarCompra() {
  const proveedorId = document.getElementById("proveedorId").value;

  if (!proveedorId) {
    mostrarMensajeEn("mensajeCompra", "Selecciona un proveedor", "error");
    return;
  }
  if (carritoCompra.length === 0) {
    mostrarMensajeEn("mensajeCompra", "Agrega al menos un producto", "error");
    return;
  }

  const body = {
    proveedorId: parseInt(proveedorId, 10),
    items: carritoCompra.map(i => ({
      codigoBarras: i.codigoBarras,
      cantidad: i.cantidad,
      costoUnitario: i.costoUnitario
    }))
  };

  try {
    await apiFetch("/compras", { method: "POST", body: JSON.stringify(body) });
    mostrarMensajeEn("mensajeCompra", "Compra registrada, stock actualizado", "ok");
    carritoCompra = [];
    renderCarritoCompra();
    await cargarHistorialCompras();
  } catch (e) {
    mostrarMensajeEn("mensajeCompra", e.message, "error");
  }
}

async function cargarHistorialCompras() {
  const div = document.getElementById("historialCompras");
  try {
    const compras = await apiFetch("/compras");
    if (compras.length === 0) {
      div.innerHTML = `<div class="estado-vacio"><i class="bi bi-receipt"></i>Sin compras registradas todavia</div>`;
      return;
    }
    div.innerHTML = "";
    compras.forEach(c => {
      const items = (c.detalles || [])
        .map(d => `${d.producto ? d.producto.nombre : "?"} x${d.cantidad}`)
        .join(", ");
      const fecha = c.fecha ? new Date(c.fecha).toLocaleString() : "";
      div.innerHTML += `
        <div class="transaccion">
          <div class="transaccion-icono"><i class="bi bi-truck"></i></div>
          <div class="transaccion-info">
            <strong>${c.proveedor ? c.proveedor.nombre : "Proveedor eliminado"}</strong>
            <small>${fecha}${items ? " · " + items : ""}</small>
          </div>
          <div class="transaccion-monto">$${Number(c.total).toFixed(2)}</div>
        </div>`;
    });
  } catch (e) {
    div.innerHTML = `<div class="msg error">${e.message}</div>`;
  }
}

cargarProveedores();
cargarHistorialCompras();
</script>

</body>
</html>
