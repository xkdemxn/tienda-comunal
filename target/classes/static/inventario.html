<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22c55e;
    --accent-dark: #16a34a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  #reader {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
  }
  input, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 10px;
  }
  input[readonly] { color: var(--muted); }
  label.campo {
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin: -4px 0 4px;
  }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  button:active { background: var(--accent-dark); }
  button.secundario {
    background: transparent;
    border: 1px solid #334155;
    color: var(--text);
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tabs button {
    margin-bottom: 0;
    background: transparent;
    border: 1px solid #334155;
    color: var(--muted);
  }
  .tabs button.activa {
    background: var(--accent);
    color: #0f172a;
    border-color: var(--accent);
  }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #334155;
    font-size: 14px;
    gap: 10px;
  }
  .item:last-child { border-bottom: none; }
  .item small { color: var(--muted); display: block; }
  .item button {
    width: auto;
    padding: 8px 12px;
    margin-bottom: 0;
    white-space: nowrap;
  }
  .msg {
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .msg.ok { background: #14532d; color: #bbf7d0; }
  .msg.error { background: #450a0a; color: #fecaca; }
  .oculto { display: none; }
  .modal-fondo {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }
  .modal img {
    width: 100%;
    background: #fff;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 12px;
  }
  .modal-fondo.oculto { display: none; }
</style>
</head>
<body>

<h1>📦 Inventario</h1>

<!-- Login -->
<div class="card" id="loginCard">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Contrasena">
  <button onclick="login()">Iniciar sesion</button>
  <div id="loginMsg"></div>
</div>

<!-- Panel principal (oculto hasta iniciar sesion) -->
<div id="panel" class="oculto">

  <div class="tabs">
    <button id="tabBtnCodigos" class="activa" onclick="mostrarTab('codigos')">Codigos de barra</button>
    <button id="tabBtnEscaneo" onclick="mostrarTab('escaneo')">Agregar stock</button>
  </div>

  <!-- Tab: lista de codigos de barra -->
  <div id="tabCodigos">
    <div class="card">
      <input type="text" id="buscarProducto" placeholder="Buscar por nombre..." oninput="filtrarProductos()">
      <div id="listaProductos">Cargando productos...</div>
    </div>
  </div>

  <!-- Tab: escanear para agregar stock / dar de alta productos -->
  <div id="tabEscaneo" class="oculto">

    <div class="card">
      <label class="campo">Que estas guardando (opcional, ayuda a categorizar productos nuevos)</label>
      <select id="categoriaSesion">
        <option value="">Sin categoria</option>
      </select>
    </div>

    <div class="card">
      <div id="reader"></div>
      <button class="secundario" onclick="reiniciarCamara()">Reiniciar camara</button>
      <button class="secundario" onclick="abrirFormularioManual()">Agregar producto sin codigo de barras</button>
    </div>

    <div id="mensaje"></div>

    <!-- Formulario de producto nuevo: aparece cuando se escanea un codigo que no existe,
         o al usar el boton de "sin codigo de barras" -->
    <div class="card oculto" id="cardProductoNuevo">
      <h2>Producto nuevo</h2>

      <label class="campo">Codigo de barras</label>
      <input type="text" id="nuevoCodigoBarras" readonly>

      <label class="campo">Categoria</label>
      <select id="nuevoCategoria">
        <option value="">Sin categoria</option>
      </select>

      <label class="campo">Nombre</label>
      <input type="text" id="nuevoNombre" placeholder="Ej: Coca Cola 600ml">

      <label class="campo">Precio de venta</label>
      <input type="number" id="nuevoPrecioVenta" step="0.01" min="0">

      <label class="campo">Precio de compra (opcional)</label>
      <input type="number" id="nuevoPrecioCompra" step="0.01" min="0">

      <label class="campo">Cantidad inicial en stock</label>
      <input type="number" id="nuevoStockActual" min="1" value="1">

      <label class="campo">Stock minimo (alerta de stock bajo)</label>
      <input type="number" id="nuevoStockMinimo" min="0" value="5">

      <button onclick="guardarProductoNuevo()">Guardar producto</button>
      <button class="secundario" onclick="cerrarFormularioNuevo()">Cancelar</button>
    </div>
  </div>

</div>

<!-- Modal para ver/imprimir el codigo de barras -->
<div id="modalFondo" class="modal-fondo oculto" onclick="cerrarModalSiFondo(event)">
  <div class="modal">
    <img id="modalImagen" alt="Codigo de barras">
    <button onclick="imprimirCodigo()">Imprimir</button>
    <button class="secundario" onclick="cerrarModal()">Cerrar</button>
  </div>
</div>

<script>
const API_BASE = window.location.origin + "/api";
let token = localStorage.getItem("token") || "";
let productos = [];
let categorias = [];
let html5QrCode;
let escaneando = false;
let codigoFormularioActual = null;

// ---------- LOGIN ----------
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msgDiv = document.getElementById("loginMsg");

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) throw new Error((await res.json()).mensaje || "Error al iniciar sesion");

    const data = await res.json();
    token = data.token;
    localStorage.setItem("token", token);
    mostrarPanel();
  } catch (e) {
    msgDiv.innerHTML = `<div class="msg error">${e.message}</div>`;
  }
}

if (token) {
  window.addEventListener("load", mostrarPanel);
}

function mostrarPanel() {
  document.getElementById("loginCard").classList.add("oculto");
  document.getElementById("panel").classList.remove("oculto");
  cargarProductos();
  cargarCategorias();
}

// ---------- TABS ----------
function mostrarTab(tab) {
  const esCodigos = tab === "codigos";
  document.getElementById("tabCodigos").classList.toggle("oculto", !esCodigos);
  document.getElementById("tabEscaneo").classList.toggle("oculto", esCodigos);
  document.getElementById("tabBtnCodigos").classList.toggle("activa", esCodigos);
  document.getElementById("tabBtnEscaneo").classList.toggle("activa", !esCodigos);

  if (esCodigos) {
    detenerCamara();
  } else {
    iniciarCamara();
  }
}

// ---------- CATEGORIAS ----------
async function cargarCategorias() {
  try {
    const res = await fetch(`${API_BASE}/categorias`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    if (!res.ok) return;
    categorias = await res.json();

    [document.getElementById("categoriaSesion"), document.getElementById("nuevoCategoria")]
      .forEach(select => {
        categorias.forEach(c => {
          const opcion = document.createElement("option");
          opcion.value = c.id;
          opcion.innerText = c.nombre;
          select.appendChild(opcion);
        });
      });
  } catch (e) {
    // Sin categorias no bloqueamos el flujo, simplemente queda "Sin categoria"
  }
}

// ---------- LISTA DE PRODUCTOS / CODIGOS DE BARRA ----------
async function cargarProductos() {
  const div = document.getElementById("listaProductos");
  try {
    const res = await fetch(`${API_BASE}/productos`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    if (!res.ok) throw new Error("No se pudieron cargar los productos");
    productos = await res.json();
    renderProductos(productos);
  } catch (e) {
    div.innerHTML = `<div class="msg error">${e.message}</div>`;
  }
}

function filtrarProductos() {
  const texto = document.getElementById("buscarProducto").value.toLowerCase();
  renderProductos(productos.filter(p => p.nombre.toLowerCase().includes(texto)));
}

function renderProductos(lista) {
  const div = document.getElementById("listaProductos");
  if (lista.length === 0) {
    div.innerHTML = `<p style="color:var(--muted)">Sin productos</p>`;
    return;
  }
  div.innerHTML = "";
  lista.forEach(p => {
    div.innerHTML += `
      <div class="item">
        <div>
          ${p.nombre}
          <small>${p.codigoBarras}</small>
        </div>
        <button onclick="verCodigoBarras(${p.id})">Ver</button>
      </div>`;
  });
}

async function verCodigoBarras(id) {
  try {
    const res = await fetch(`${API_BASE}/productos/${id}/codigo-barras`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    if (!res.ok) throw new Error("No se pudo generar el codigo de barras");
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    document.getElementById("modalImagen").src = url;
    document.getElementById("modalFondo").classList.remove("oculto");
  } catch (e) {
    alert(e.message);
  }
}

function cerrarModal() {
  document.getElementById("modalFondo").classList.add("oculto");
}

function cerrarModalSiFondo(event) {
  if (event.target.id === "modalFondo") cerrarModal();
}

function imprimirCodigo() {
  const src = document.getElementById("modalImagen").src;
  const ventana = window.open("", "_blank");
  ventana.document.write(`<img src="${src}" style="width:100%" onload="window.print()">`);
}

// ---------- CAMARA / ESCANEO PARA AGREGAR STOCK ----------
function iniciarCamara() {
  if (escaneando) return;
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 250, height: 120 } };

  html5QrCode.start(
    { facingMode: "environment" },
    config,
    onCodigoDetectado,
    () => {}
  ).then(() => { escaneando = true; });
}

function detenerCamara() {
  if (html5QrCode && escaneando) {
    html5QrCode.stop().then(() => { escaneando = false; });
  }
}

function reiniciarCamara() {
  detenerCamara();
  setTimeout(iniciarCamara, 300);
}

let ultimoCodigo = "";
let ultimoTiempo = 0;

async function onCodigoDetectado(codigo) {
  // Evita registrar el mismo codigo varias veces por segundo mientras la camara sigue enfocada.
  // Para sumar mas unidades del mismo producto (ej: una paca de 12), se vuelve a escanear
  // pasado ese margen, una vez por cada unidad fisica.
  const ahora = Date.now();
  if (codigo === ultimoCodigo && ahora - ultimoTiempo < 2000) return;
  ultimoCodigo = codigo;
  ultimoTiempo = ahora;

  try {
    const res = await fetch(`${API_BASE}/escaneo/${codigo}`, {
      headers: { "Authorization": `Bearer ${token}` }
    });

    if (res.ok) {
      // El producto ya existe: solo sumamos 1 unidad de stock, sin pedir nada mas.
      const producto = await res.json();
      await registrarEntradaRapida(producto.codigoBarras, producto.nombre);
    } else {
      // Codigo nunca visto: pedimos las caracteristicas del producto una sola vez.
      abrirFormularioProductoNuevo(codigo);
    }
  } catch (e) {
    mostrarMensaje(e.message, "error");
  }
}

async function registrarEntradaRapida(codigoBarras, nombre) {
  try {
    const res = await fetch(`${API_BASE}/inventario/ajuste`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        codigoBarras,
        cantidad: 1,
        motivo: "Entrada por escaneo",
        esPositivo: true
      })
    });
    if (!res.ok) throw new Error((await res.json()).mensaje || "Error al actualizar el stock");

    const producto = await res.json();
    mostrarMensaje(`Stock actualizado: ${producto.nombre} → ${producto.stockActual}`, "ok");
  } catch (e) {
    mostrarMensaje(e.message, "error");
  }
}

function mostrarMensaje(texto, tipo) {
  const div = document.getElementById("mensaje");
  div.innerHTML = `<div class="msg ${tipo}">${texto}</div>`;
  setTimeout(() => { div.innerHTML = ""; }, 2500);
}

// ---------- FORMULARIO DE PRODUCTO NUEVO ----------
let formularioEsManual = false;

function abrirFormularioProductoNuevo(codigo) {
  formularioEsManual = false;
  codigoFormularioActual = codigo;
  document.getElementById("nuevoCodigoBarras").value = codigo;
  document.getElementById("nuevoCategoria").value = document.getElementById("categoriaSesion").value;
  document.getElementById("nuevoNombre").value = "";
  document.getElementById("nuevoPrecioVenta").value = "";
  document.getElementById("nuevoPrecioCompra").value = "";
  document.getElementById("nuevoStockActual").value = "1";
  document.getElementById("nuevoStockMinimo").value = "5";
  document.getElementById("cardProductoNuevo").classList.remove("oculto");
  mostrarMensaje("Codigo nuevo, completa los datos del producto", "ok");
}

function abrirFormularioManual() {
  const codigoInterno = `MANUAL-${Date.now()}`;
  abrirFormularioProductoNuevo(codigoInterno);
  formularioEsManual = true;
}

function cerrarFormularioNuevo() {
  document.getElementById("cardProductoNuevo").classList.add("oculto");
  codigoFormularioActual = null;
}

async function guardarProductoNuevo() {
  const nombre = document.getElementById("nuevoNombre").value.trim();
  const precioVenta = parseFloat(document.getElementById("nuevoPrecioVenta").value);
  const precioCompraTexto = document.getElementById("nuevoPrecioCompra").value;
  const stockActual = parseInt(document.getElementById("nuevoStockActual").value, 10);
  const stockMinimo = parseInt(document.getElementById("nuevoStockMinimo").value, 10);
  const categoriaId = document.getElementById("nuevoCategoria").value;

  if (!nombre) {
    mostrarMensaje("Falta el nombre del producto", "error");
    return;
  }
  if (!precioVenta || precioVenta <= 0) {
    mostrarMensaje("Precio de venta invalido", "error");
    return;
  }
  if (!stockActual || stockActual < 1) {
    mostrarMensaje("Cantidad inicial invalida", "error");
    return;
  }

  const body = {
    codigoBarras: codigoFormularioActual,
    nombre,
    precioVenta,
    precioCompra: precioCompraTexto ? parseFloat(precioCompraTexto) : null,
    stockActual,
    stockMinimo: stockMinimo || 5,
    categoria: categoriaId ? { id: parseInt(categoriaId, 10) } : null
  };

  try {
    const res = await fetch(`${API_BASE}/productos`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error((await res.json()).mensaje || "Error al crear el producto");

    const producto = await res.json();
    mostrarMensaje(`Producto creado: ${producto.nombre}`, "ok");
    cerrarFormularioNuevo();
    await cargarProductos();

    // Si no tiene un codigo fisico real, ofrecemos imprimir la etiqueta generada
    // para poder pegarla en el producto y que quede escaneable a futuro.
    if (formularioEsManual) {
      verCodigoBarras(producto.id);
    }
  } catch (e) {
    mostrarMensaje(e.message, "error");
  }
}
</script>

</body>
</html>
