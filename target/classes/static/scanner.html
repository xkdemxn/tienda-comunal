<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escaner de inventario</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22c55e;
    --accent-dark: #16a34a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  #reader {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
  }
  input, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 10px;
  }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  button:active { background: var(--accent-dark); }
  button.secundario {
    background: transparent;
    border: 1px solid #334155;
    color: var(--text);
  }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #334155;
    font-size: 14px;
  }
  .item:last-child { border-bottom: none; }
  .item small { color: var(--muted); display: block; }
  .total {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: 700;
    margin-top: 12px;
  }
  .total small {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
  }
  .resultados-busqueda .item button {
    width: auto;
    padding: 8px 12px;
    margin-bottom: 0;
  }
  .msg {
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .msg.ok { background: #14532d; color: #bbf7d0; }
  .msg.error { background: #450a0a; color: #fecaca; }
  .oculto { display: none; }
</style>
</head>
<body>

<h1>📦 Escaner de inventario</h1>

<!-- Login -->
<div class="card" id="loginCard">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Contrasena">
  <button onclick="login()">Iniciar sesion</button>
  <div id="loginMsg"></div>
</div>

<!-- Panel principal (oculto hasta iniciar sesion) -->
<div id="panel" class="oculto">

  <div class="card">
    <div id="reader"></div>
    <button class="secundario" onclick="reiniciarCamara()">Reiniciar camara</button>
  </div>

  <div id="mensaje"></div>

  <div class="card">
    <label style="font-size:13px; color:var(--muted)">Producto sin codigo de barras (ej: pan)</label>
    <input type="text" id="buscarProductoVenta" placeholder="Buscar por nombre..." oninput="buscarProductoParaVenta()">
    <div id="resultadosBusquedaVenta" class="resultados-busqueda"></div>
  </div>

  <div class="card">
    <strong>Carrito</strong>
    <div id="carrito"></div>
    <div class="total">
      <span>Total <small id="unidadesCarrito">0 productos</small></span>
      <span id="totalCarrito">$0.00</span>
    </div>
  </div>

  <div class="card">
    <button onclick="confirmarVenta()">Confirmar venta</button>
    <button class="secundario" onclick="vaciarCarrito()">Vaciar carrito</button>
  </div>

</div>

<script>
const API_BASE = window.location.origin + "/api";
let token = localStorage.getItem("token") || "";
let carrito = []; // { codigoBarras, nombre, precio, cantidad }
let html5QrCode;
let escaneando = false;

// ---------- LOGIN ----------
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msgDiv = document.getElementById("loginMsg");

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) throw new Error((await res.json()).mensaje || "Error al iniciar sesion");

    const data = await res.json();
    token = data.token;
    localStorage.setItem("token", token);
    document.getElementById("loginCard").classList.add("oculto");
    document.getElementById("panel").classList.remove("oculto");
    iniciarCamara();
  } catch (e) {
    msgDiv.innerHTML = `<div class="msg error">${e.message}</div>`;
  }
}

// Si ya habia un token guardado, saltamos el login
if (token) {
  document.getElementById("loginCard").classList.add("oculto");
  document.getElementById("panel").classList.remove("oculto");
  window.addEventListener("load", iniciarCamara);
}

// ---------- CAMARA / ESCANEO ----------
function iniciarCamara() {
  if (escaneando) return;
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 250, height: 120 } };

  html5QrCode.start(
    { facingMode: "environment" }, // camara trasera del celular
    config,
    onCodigoDetectado,
    () => {} // errores de frame individuales, se ignoran
  ).then(() => { escaneando = true; });
}

function reiniciarCamara() {
  if (html5QrCode && escaneando) {
    html5QrCode.stop().then(() => {
      escaneando = false;
      iniciarCamara();
    });
  } else {
    iniciarCamara();
  }
}

let ultimoCodigo = "";
let ultimoTiempo = 0;

async function onCodigoDetectado(codigo) {
  // Evita agregar el mismo producto varias veces por segundo mientras la camara sigue enfocada
  const ahora = Date.now();
  if (codigo === ultimoCodigo && ahora - ultimoTiempo < 2000) return;
  ultimoCodigo = codigo;
  ultimoTiempo = ahora;

  try {
    const res = await fetch(`${API_BASE}/escaneo/${codigo}`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    if (!res.ok) throw new Error((await res.json()).mensaje || "Codigo no reconocido");

    const producto = await res.json();

    if (!producto.stockSuficiente) {
      mostrarMensaje(`"${producto.nombre}" no tiene stock disponible`, "error");
      return;
    }

    agregarAlCarrito(producto);
    mostrarMensaje(`Agregado: ${producto.nombre}`, "ok");
  } catch (e) {
    mostrarMensaje(e.message, "error");
  }
}

function mostrarMensaje(texto, tipo) {
  const div = document.getElementById("mensaje");
  div.innerHTML = `<div class="msg ${tipo}">${texto}</div>`;
  setTimeout(() => { div.innerHTML = ""; }, 2500);
}

// ---------- CARRITO ----------
function agregarAlCarrito(producto) {
  const existente = carrito.find(i => i.codigoBarras === producto.codigoBarras);
  if (existente) {
    existente.cantidad += 1;
  } else {
    carrito.push({
      codigoBarras: producto.codigoBarras,
      nombre: producto.nombre,
      precio: producto.precioVenta,
      cantidad: 1
    });
  }
  renderCarrito();
}

function renderCarrito() {
  const div = document.getElementById("carrito");
  div.innerHTML = "";
  let total = 0;
  let unidades = 0;

  carrito.forEach((item, idx) => {
    const subtotal = item.precio * item.cantidad;
    total += subtotal;
    unidades += item.cantidad;
    div.innerHTML += `
      <div class="item">
        <div>
          ${item.nombre}
          <small>${item.cantidad} x $${item.precio.toFixed(2)}</small>
        </div>
        <div>
          $${subtotal.toFixed(2)}
          <button class="secundario" style="width:auto; padding:4px 8px; margin-left:8px"
                  onclick="quitarDelCarrito(${idx})">✕</button>
        </div>
      </div>`;
  });

  document.getElementById("totalCarrito").innerText = `$${total.toFixed(2)}`;
  document.getElementById("unidadesCarrito").innerText =
    `${unidades} producto${unidades === 1 ? "" : "s"}`;
}

function quitarDelCarrito(idx) {
  carrito.splice(idx, 1);
  renderCarrito();
}

function vaciarCarrito() {
  carrito = [];
  renderCarrito();
}

// ---------- BUSQUEDA MANUAL (productos sin codigo de barras, ej: pan) ----------
let temporizadorBusqueda;

function buscarProductoParaVenta() {
  clearTimeout(temporizadorBusqueda);
  const texto = document.getElementById("buscarProductoVenta").value.trim();
  const div = document.getElementById("resultadosBusquedaVenta");

  if (texto.length < 2) {
    div.innerHTML = "";
    return;
  }

  temporizadorBusqueda = setTimeout(async () => {
    try {
      const res = await fetch(`${API_BASE}/productos/buscar?nombre=${encodeURIComponent(texto)}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (!res.ok) throw new Error("Error al buscar productos");

      const productos = await res.json();
      if (productos.length === 0) {
        div.innerHTML = `<p style="color:var(--muted); font-size:13px; margin:8px 0 0">Sin resultados</p>`;
        return;
      }

      div.innerHTML = "";
      productos.forEach(p => {
        div.innerHTML += `
          <div class="item">
            <div>
              ${p.nombre}
              <small>Stock: ${p.stockActual} · $${Number(p.precioVenta).toFixed(2)}</small>
            </div>
            <button onclick="agregarProductoBuscado(${p.id})">Agregar</button>
          </div>`;
      });
      window.__resultadosBusqueda = productos;
    } catch (e) {
      div.innerHTML = `<div class="msg error">${e.message}</div>`;
    }
  }, 300);
}

function agregarProductoBuscado(id) {
  const producto = (window.__resultadosBusqueda || []).find(p => p.id === id);
  if (!producto) return;

  agregarAlCarrito({
    codigoBarras: producto.codigoBarras,
    nombre: producto.nombre,
    precioVenta: producto.precioVenta
  });
  mostrarMensaje(`Agregado: ${producto.nombre}`, "ok");
  document.getElementById("buscarProductoVenta").value = "";
  document.getElementById("resultadosBusquedaVenta").innerHTML = "";
}

// ---------- CONFIRMAR VENTA ----------
async function confirmarVenta() {
  if (carrito.length === 0) {
    mostrarMensaje("El carrito esta vacio", "error");
    return;
  }

  const body = {
    items: carrito.map(i => ({ codigoBarras: i.codigoBarras, cantidad: i.cantidad }))
  };

  try {
    const res = await fetch(`${API_BASE}/ventas`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error((await res.json()).mensaje || "Error al registrar la venta");

    const venta = await res.json();
    mostrarMensaje(`Venta registrada: $${venta.totalMonedaLocal}`, "ok");
    vaciarCarrito();
  } catch (e) {
    mostrarMensaje(e.message, "error");
  }
}
</script>

</body>
</html>
