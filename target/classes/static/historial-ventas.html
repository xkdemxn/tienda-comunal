<script src="dashboard.js"></script>
<script>
initSidebar("historial-ventas");

function hoyISO() {
  return fechaLocalISO(new Date());
}

function prepararFechasHistorial() {
  const desde = document.getElementById("histDesde");
  const hasta = document.getElementById("histHasta");
  if (!hasta.value) hasta.value = hoyISO();
  if (!desde.value) desde.value = hoyISO();
}

function formatoFechaLarga(fechaIso) {
  return new Date(fechaIso).toLocaleDateString("es", {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });
}

function formatoHora(fechaIso) {
  return new Date(fechaIso).toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
}

function formatoFechaCorta(fechaIso) {
  return new Date(fechaIso + "T00:00:00").toLocaleDateString("es", { day: "2-digit", month: "short" });
}

async function cargarHistorial() {
  prepararFechasHistorial();
  const desde = `${document.getElementById("histDesde").value}T00:00:00`;
  const hasta = `${document.getElementById("histHasta").value}T23:59:59`;
  const div = document.getElementById("histResultado");
  div.innerHTML = `<p style="color:var(--muted)">Cargando...</p>`;

  try {
    const [ventas, fiados] = await Promise.all([
      apiFetch(`/ventas?desde=${desde}&hasta=${hasta}`),
      apiFetch(`/deudores/fiado-en-rango?desde=${desde}&hasta=${hasta}`).catch(() => [])
    ]);

    if (ventas.length === 0 && fiados.length === 0) {
      div.innerHTML = `<div class="card"><div class="estado-vacio"><i class="bi bi-receipt"></i>Sin ventas en este rango</div></div>`;
      return;
    }

    // Se unen ventas en efectivo y fiados en una sola linea de tiempo, pero
    // el fiado NO es dinero cobrado - por eso se calcula y se muestra
    // siempre como un total aparte, nunca sumado al total en efectivo.
    const transacciones = [
      ...ventas.map(v => ({
        fecha: v.fecha, monto: Number(v.totalMonedaLocal), esFiado: false,
        items: v.detalles.map(d => d.peso ? `${d.producto} (${d.peso} lb)` : `${d.producto} x${d.cantidad}`).join(", ")
      })),
      ...fiados.map(f => ({
        fecha: f.fecha, monto: Number(f.monto), esFiado: true,
        items: (f.detalles && f.detalles.length > 0)
          ? f.detalles.map(d => `${d.cantidad}x ${d.producto}`).join(", ")
          : (f.descripcion || ""),
        deudorNombre: f.deudorNombre, estado: f.estado, pagado: Number(f.pagado || 0)
      }))
    ].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

    // Agrupar por dia (ya quedo ordenado de mas reciente a mas antiguo)
    const porDia = new Map();
    transacciones.forEach(t => {
      const dia = t.fecha.slice(0, 10);
      if (!porDia.has(dia)) porDia.set(dia, []);
      porDia.get(dia).push(t);
    });

    const totalEfectivo = ventas.reduce((acc, v) => acc + Number(v.totalMonedaLocal), 0);
    const totalFiado = fiados.reduce((acc, f) => acc + Number(f.monto), 0);
    const totalPagado = fiados.reduce((acc, f) => acc + Number(f.pagado || 0), 0);
    let html = `
      <div class="stat-grid">
        <div class="stat-card">
          <div class="nav-icono g-verde"><i class="bi bi-cash-coin"></i></div>
          <div class="etiqueta">Total en efectivo <small>${ventas.length} venta${ventas.length === 1 ? "" : "s"}</small></div>
          <div class="valor valor-positivo">$${totalEfectivo.toFixed(2)}</div>
        </div>
        <div class="stat-card">
          <div class="nav-icono g-rojo"><i class="bi bi-people"></i></div>
          <div class="etiqueta">Fiado pendiente <small>de $${totalFiado.toFixed(2)} fiado en ${fiados.length} movimiento${fiados.length === 1 ? "" : "s"}</small></div>
          <div class="valor" style="color:var(--danger)">$${(totalFiado - totalPagado).toFixed(2)}</div>
        </div>
        <div class="stat-card">
          <div class="nav-icono g-verde"><i class="bi bi-check2-circle"></i></div>
          <div class="etiqueta">Deuda pagada <small>abonos ya cubiertos de esos fiados</small></div>
          <div class="valor valor-positivo">$${totalPagado.toFixed(2)}</div>
        </div>
      </div>`;

    if (porDia.size > 1) {
      html += `
        <div class="card">
          <h2><i class="bi bi-bar-chart-line"></i> Ventas en efectivo por dia</h2>
          <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:center">
            <canvas id="graficoPorDia" width="200" height="200" style="flex-shrink:0"></canvas>
            <div id="leyendaPorDia" style="flex:1; min-width:180px"></div>
          </div>
        </div>`;
    }

    porDia.forEach((transDelDia, dia) => {
      const totalDia = transDelDia.reduce((acc, t) => acc + (t.esFiado ? 0 : t.monto), 0);
      const fiadoDia = transDelDia.reduce((acc, t) => acc + (t.esFiado ? t.monto : 0), 0);
      html += `
        <div class="card">
          <div class="item" style="border-bottom:none">
            <div><strong>${formatoFechaLarga(dia + "T00:00:00")}</strong>
              <small>${transDelDia.length} movimiento${transDelDia.length === 1 ? "" : "s"}${fiadoDia > 0 ? ` · fiado: $${fiadoDia.toFixed(2)}` : ""}</small>
            </div>
            <strong>$${totalDia.toFixed(2)}</strong>
          </div>`;

      transDelDia.forEach(t => {
        html += `
          <div class="transaccion">
            <div class="transaccion-icono"${t.esFiado ? (t.estado === "PAGADO" ? ' style="background:#dcfce7; color:var(--accent)"' : ' style="background:#fee2e2; color:var(--danger)"') : ""}>
              <i class="bi ${t.esFiado ? (t.estado === "PAGADO" ? "bi-check2-circle" : "bi-people") : "bi-receipt"}"></i>
            </div>
            <div class="transaccion-info">
              <strong class="hora-venta">${formatoHora(t.fecha)}${t.esFiado ? " " + badgeFiado(t.estado, t.pagado) : ""}</strong>
              <small>${t.esFiado ? `${t.deudorNombre} · ` : ""}${t.items}</small>
            </div>
            <div class="transaccion-monto"${t.esFiado ? estiloMontoFiado(t.estado) : ""}>$${t.monto.toFixed(2)}</div>
          </div>`;
      });

      html += `</div>`;
    });

    div.innerHTML = html;

    if (porDia.size > 1) {
      const datosGrafico = Array.from(porDia.entries()).map(([dia, transDelDia]) => ({
        label: formatoFechaCorta(dia),
        valor: transDelDia.reduce((acc, t) => acc + (t.esFiado ? 0 : t.monto), 0)
      })).filter(d => d.valor > 0);
      dibujarGraficoPastel("graficoPorDia", datosGrafico, "leyendaPorDia",
        v => `$${Number(v).toFixed(2)}`);
    }
  } catch (e) {
    div.innerHTML = `<div class="msg error"><i class="bi bi-exclamation-circle-fill"></i><span>${e.message}</span></div>`;
  }
}

cargarHistorial();
</script>
