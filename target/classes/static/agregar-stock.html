<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agregar stock</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  .stock-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .stock-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <div id="fondoSidebarMovil" class="fondo-sidebar-movil"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header"><i class="bi bi-shop"></i> Tienda</div>
    <nav class="sidebar-nav">
      <a href="dashboard" data-pagina="inicio"><span class="nav-icono g-azul"><i class="bi bi-house-door"></i></span><span class="nav-texto">Inicio</span></a>
      <a href="venta" data-pagina="venta"><span class="nav-icono g-verde"><i class="bi bi-cart3"></i></span><span class="nav-texto">Vender</span></a>
      <a href="agregar-stock" data-pagina="agregar-stock"><span class="nav-icono g-cian"><i class="bi bi-plus-circle"></i></span><span class="nav-texto">Agregar stock</span></a>
      <a href="deudores" data-pagina="deudores"><span class="nav-icono g-rosa"><i class="bi bi-people"></i></span><span class="nav-texto">Fiar</span></a>
      <a href="historial-ventas" data-pagina="historial-ventas"><span class="nav-icono g-naranja"><i class="bi bi-clock-history"></i></span><span class="nav-texto">Historial de ventas</span></a>

      <button class="grupo-toggle" data-grupo="catalogo" data-solo-admin="1" onclick="toggleGrupo('catalogo')">
        <span class="nav-icono g-morado"><i class="bi bi-grid"></i></span><span class="nav-texto">Catalogo</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-catalogo" data-grupo="catalogo">
        <a href="categorias" data-pagina="categorias" data-solo-admin="1"><span class="nav-icono g-morado"><i class="bi bi-tags"></i></span><span class="nav-texto">Categorias</span></a>
        <a href="productos" data-pagina="productos" data-solo-admin="1"><span class="nav-icono g-teal"><i class="bi bi-box-seam"></i></span><span class="nav-texto">Productos</span></a>
      </div>

      <button class="grupo-toggle" data-grupo="abastecimiento" data-solo-admin="1" onclick="toggleGrupo('abastecimiento')">
        <span class="nav-icono g-indigo"><i class="bi bi-truck"></i></span><span class="nav-texto">Abastecimiento</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-abastecimiento" data-grupo="abastecimiento">
        <a href="proveedores" data-pagina="proveedores" data-solo-admin="1"><span class="nav-icono g-indigo"><i class="bi bi-truck"></i></span><span class="nav-texto">Proveedores</span></a>
        <a href="compras" data-pagina="compras" data-solo-admin="1"><span class="nav-icono g-ambar"><i class="bi bi-receipt"></i></span><span class="nav-texto">Compras</span></a>
        <a href="caducados" data-pagina="caducados" data-solo-admin="1"><span class="nav-icono g-rojo"><i class="bi bi-exclamation-triangle"></i></span><span class="nav-texto">Caducados</span></a>
      </div>

      <button class="grupo-toggle" data-grupo="reportes" data-solo-admin="1" onclick="toggleGrupo('reportes')">
        <span class="nav-icono g-azul"><i class="bi bi-graph-up"></i></span><span class="nav-texto">Reportes</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-reportes" data-grupo="reportes">
        <a href="estadisticas" data-pagina="estadisticas" data-solo-admin="1"><span class="nav-icono g-azul"><i class="bi bi-bar-chart-line"></i></span><span class="nav-texto">Estadisticas</span></a>
        <a href="fiscalizacion" data-pagina="fiscalizacion" data-solo-admin="1"><span class="nav-icono g-violeta"><i class="bi bi-clipboard-data"></i></span><span class="nav-texto">Fiscalizacion</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="perfil-mini">
        <span class="avatar-mini" id="sidebarAvatar">?</span>
        <div class="perfil-mini-textos">
          <div class="nombre" id="sidebarNombre"></div>
          <div class="rol" id="sidebarRol"></div>
        </div>
      </div>
      <button onclick="logout()"><i class="bi bi-box-arrow-right"></i> Cerrar sesion</button>
    </div>
  </aside>

  <div class="contenido">
    <div class="topbar">
      <button id="btnHamburguesa" class="btn-hamburguesa"><i class="bi bi-list"></i></button>
      <h1>Agregar stock</h1>
    </div>
    <div class="pagina">

      <div class="stock-layout">
        <div>
          <div class="card">
            <label class="campo">Que estas guardando (preselecciona la categoria de los productos nuevos)</label>
            <select id="categoriaSesion">
              <option value="">Sin elegir</option>
            </select>
            <label class="campo" style="display:flex; align-items:flex-start; gap:8px; margin:6px 0 0; cursor:pointer">
              <input type="checkbox" id="pagadoConCaja" checked style="width:auto; margin:3px 0 0">
              <span>Se pago con plata de la caja
                <small style="display:block; color:var(--muted)">Se registra como compra (precio de compra x cantidad) y resta del efectivo esperado en el arqueo de caja. Desmarcalo si no salio plata de la caja (regalo, correccion, producto que ya tenias).</small>
              </span>
            </label>
          </div>

          <div class="card">
            <div id="reader"></div>
            <div style="margin-top: 10px;" class="controles-camara">
              <button class="secundario" onclick="reiniciarCamara()" title="Reiniciar la camara si se congela o no enfoca">
                <i class="bi bi-arrow-clockwise"></i> Reiniciar
              </button>
              <button class="secundario" id="btnFlash" onclick="toggleFlash()" title="Encender/apagar el flash">
                <i class="bi bi-lightning-charge-fill"></i> Flash
              </button>
            </div>
            <button class="secundario" onclick="abrirFormularioManual()"><i class="bi bi-pencil-square"></i> Agregar producto sin codigo de barras</button>
          </div>
        </div>

        <div>
          <div class="card">
            <label class="campo">
              ¿Ya tienes este producto pero el codigo no coincide? 
              Buscalo y sumale stock directo, sin escanear
            </label>
            <input type="text" id="buscarProductoExistente" placeholder="Buscar por nombre..." oninput="buscarProductoExistente()">
            <div id="resultadosBusquedaExistente"></div>
          </div>
        </div>
      </div>

      <div id="mensaje"></div>

      <!-- Aparece al escanear un producto que ya existe: confirma cuanto sumar (por defecto 1) -->
      <div class="card card-accion oculto" id="cardConfirmarCantidad">
        <h2><i class="bi bi-plus-circle"></i> Sumar stock</h2>
        <p id="confirmarCantidadInfo" style="margin:0 0 10px; color:var(--muted)"></p>
        <label class="campo">Cantidad a sumar</label>
        <div class="stepper">
          <button type="button" class="secundario btn-cantidad" onclick="cambiarCantidadConfirmar(-1)">−</button>
          <input type="number" id="confirmarCantidadInput" min="1" value="1" class="stepper-input"
                 onkeydown="if(event.key==='Enter') confirmarSumaCantidad()">
          <button type="button" class="secundario btn-cantidad" onclick="cambiarCantidadConfirmar(1)">+</button>
        </div>
        <button onclick="confirmarSumaCantidad()">Sumar stock</button>
        <button class="secundario" onclick="cancelarSumaCantidad()">Cancelar</button>
      </div>

      
      <div class="card card-accion oculto" id="cardProductoNuevo">
        <h2><i class="bi bi-box-seam"></i> Producto nuevo</h2>

        <label class="campo">Codigo de barras (unidad)</label>
        <input type="text" id="nuevoCodigoBarras" readonly>

        <label class="campo">Categoria (obligatoria)</label>
        <select id="nuevoCategoria">
          <option value="">Selecciona una categoria...</option>
        </select>

        <label class="campo">Nombre</label>
        <input type="text" id="nuevoNombre" placeholder="Ej: Coca Cola 600ml">

        <label class="campo">Precio de venta</label>
        <input type="number" id="nuevoPrecioVenta" step="0.01" min="0">

        <label class="campo">Precio de compra (opcional)</label>
        <input type="number" id="nuevoPrecioCompra" step="0.01" min="0">

        <label class="campo">Cantidad inicial en stock</label>
        <input type="number" id="nuevoStockActual" min="1" value="1">

        <label class="campo">Stock minimo (alerta de stock bajo)</label>
        <input type="number" id="nuevoStockMinimo" min="0" value="5">

        <label class="campo">Codigo de barras de la caja/paquete (opcional)</label>
        <input type="text" id="nuevoCodigoCaja" placeholder="Si el proveedor vende por cajas" oninput="actualizarFilaUnidadesCaja()">

        
        <div id="filaUnidadesCaja" class="oculto">
          <label class="campo">Unidades por caja</label>
          <input type="number" id="nuevoUnidadesPorCaja" min="1" placeholder="Cuantas unidades trae la caja">
        </div>

        <label class="campo" style="display:flex; align-items:center; gap:8px; margin-top:8px">
          <input type="checkbox" id="nuevoVendidoPorPeso" style="width:auto; margin:0">
          Se vende por peso (ej: carne) — el precio de venta es por libra
        </label>

        <button onclick="guardarProductoNuevo()">Guardar producto</button>
        <button class="secundario"  onclick="cerrarFormularioNuevo()">Cancelar</button>
      </div>

    </div>
  </div>
</div>

<nav class="barra-inferior">
  <a href="dashboard" data-pagina="inicio"><i class="bi bi-house-door"></i><span>Inicio</span></a>
  <a href="agregar-stock" data-pagina="agregar-stock"><i class="bi bi-plus-circle"></i><span>Stock</span></a>
  <a href="venta" data-pagina="venta" class="accion-principal"><i class="bi bi-cart3"></i></a>
  <a href="deudores" data-pagina="deudores"><i class="bi bi-people"></i><span>Fiar</span></a>
  <button type="button" id="btnMasMovil"><i class="bi bi-grid-3x3-gap"></i><span>Mas</span></button>
</nav>

<script src="dashboard.js"></script>
<script>
initSidebar("agregar-stock");

let html5QrCode;
let escaneando = false;
let flashActivo = false;
let codigoFormularioActual = null;
let formularioEsManual = false;
let ultimoCodigo = "";
let ultimoTiempo = 0;

// ---------- CATEGORIAS ----------
async function cargarCategorias() {
  try {
    const categorias = await apiFetch("/categorias");
    [document.getElementById("categoriaSesion"), document.getElementById("nuevoCategoria")]
      .forEach(select => {
        categorias.forEach(c => {
          const opcion = document.createElement("option");
          opcion.value = c.id;
          opcion.innerText = c.nombre;
          select.appendChild(opcion);
        });
      });
  } catch (e) {
    // sin categorias no bloqueamos el flujo
  }
}
cargarCategorias();

// ---------- CAMARA ----------
async function iniciarCamara() {
  if (escaneando) return;
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 250, height: 120 } };
  const camara = await obtenerCamaraTrasera();

  html5QrCode.start(
    camara,
    config,
    onCodigoDetectado,
    () => {}
  ).then(() => { escaneando = true; });
}

function detenerCamara() {
  if (html5QrCode && escaneando) {
    html5QrCode.stop().then(() => {
      escaneando = false;
      flashActivo = false;
      document.getElementById("btnFlash").classList.remove("activo");
    });
  }
}

function reiniciarCamara() {
  detenerCamara();
  setTimeout(iniciarCamara, 300);
}

async function toggleFlash() {
  if (!html5QrCode || !escaneando) return;
  const encender = !flashActivo;
  try {
    await html5QrCode.applyVideoConstraints({
      torch: encender,
      advanced: [{ torch: encender }]
    });
    const settings = html5QrCode.getRunningTrackSettings();
    if (settings.torch !== encender) throw new Error("No soportado");
    flashActivo = encender;
    document.getElementById("btnFlash").classList.toggle("activo", flashActivo);
  } catch (e) {
    mostrarMensajeEn("mensaje", "Tu camara no permite controlar el flash desde el navegador", "error");
  }
}

async function onCodigoDetectado(codigo) {
  // Evita registrar el mismo codigo varias veces por segundo mientras la camara sigue enfocada.
  const ahora = Date.now();
  if (codigo === ultimoCodigo && ahora - ultimoTiempo < 2000) return;
  ultimoCodigo = codigo;
  ultimoTiempo = ahora;

  try {
    const resUnidad = await fetch(`${API_BASE}/escaneo/${codigo}`, {
      headers: { "Authorization": `Bearer ${getToken()}` }
    });

    if (resUnidad.ok) {
      const producto = await resUnidad.json();
      abrirConfirmarCantidad(producto);
      return;
    }

    const resCaja = await fetch(`${API_BASE}/productos/caja/${codigo}`, {
      headers: { "Authorization": `Bearer ${getToken()}` }
    });

    if (resCaja.ok) {
      const producto = await resCaja.json();
      const unidades = producto.unidadesPorCaja || 1;
      await registrarEntradaRapida(producto.codigoBarras, unidades,
        `Entrada por caja escaneada (${unidades} unidades)`);
      return;
    }

    abrirFormularioProductoNuevo(codigo);
  } catch (e) {
    mostrarMensajeEn("mensaje", e.message, "error");
  }
}

// Si la casilla "Se pago con plata de la caja" esta marcada, la entrada se
// registra como una compra directa (sin proveedor) para que el arqueo la reste.
function pagadoConCajaMarcado() {
  return document.getElementById("pagadoConCaja").checked;
}

async function registrarEntradaRapida(codigoBarras, cantidad, motivo) {
  try {
    const conCaja = pagadoConCajaMarcado();
    const producto = await apiFetch("/inventario/ajuste", {
      method: "POST",
      body: JSON.stringify({ codigoBarras, cantidad, motivo, esPositivo: true, registrarComoCompra: conCaja })
    });
    if (conCaja && !(Number(producto.precioCompra) > 0)) {
      mostrarMensajeEn("mensaje",
        `Stock actualizado: ${producto.nombre} → ${producto.stockActual}. Ojo: no tiene precio de compra, asi que no se descontó plata de la caja`, "info");
    } else {
      mostrarMensajeEn("mensaje",
        `Stock actualizado: ${producto.nombre} → ${producto.stockActual}${conCaja ? " (compra registrada)" : ""}`, "ok");
    }
  } catch (e) {
    mostrarMensajeEn("mensaje", e.message, "error");
  }
}

// ---------- CONFIRMAR CANTIDAD AL ESCANEAR UN PRODUCTO YA EXISTENTE ----------
let productoParaConfirmar = null;

function abrirConfirmarCantidad(producto) {
  productoParaConfirmar = producto;
  document.getElementById("confirmarCantidadInfo").innerText =
    `${producto.nombre} — stock actual: ${producto.stockActual}`;
  const input = document.getElementById("confirmarCantidadInput");
  input.value = "1";
  document.getElementById("cardConfirmarCantidad").classList.remove("oculto");
  input.focus();
  input.select();
}

function cambiarCantidadConfirmar(delta) {
  const input = document.getElementById("confirmarCantidadInput");
  input.value = Math.max(1, (parseInt(input.value, 10) || 1) + delta);
}

function cancelarSumaCantidad() {
  document.getElementById("cardConfirmarCantidad").classList.add("oculto");
  productoParaConfirmar = null;
}

async function confirmarSumaCantidad() {
  if (!productoParaConfirmar) return;

  const cantidad = parseInt(document.getElementById("confirmarCantidadInput").value, 10);
  if (!cantidad || cantidad < 1) {
    mostrarMensajeEn("mensaje", "Cantidad invalida", "error");
    return;
  }

  await registrarEntradaRapida(productoParaConfirmar.codigoBarras, cantidad, "Entrada por escaneo");
  cancelarSumaCantidad();
}

// ---------- BUSCAR PRODUCTO EXISTENTE Y SUMAR STOCK (sin escanear) ----------
// Para productos donde cada unidad trae un codigo de barras distinto (ej: se
// vio con botellas de agua Tesalia): el escaneo nunca va a reconocer la
// unidad #2, #3, etc. porque el codigo cambia cada vez. Esta es la salida
// manual: buscar el producto ya registrado por nombre y sumarle stock directo.
let temporizadorBusquedaExistente;
let resultadosBusquedaExistente = [];

function buscarProductoExistente() {
  clearTimeout(temporizadorBusquedaExistente);
  const texto = document.getElementById("buscarProductoExistente").value.trim();
  const div = document.getElementById("resultadosBusquedaExistente");

  if (texto.length < 2) {
    div.innerHTML = "";
    return;
  }

  temporizadorBusquedaExistente = setTimeout(async () => {
    try {
      resultadosBusquedaExistente = await apiFetch(`/productos/buscar?nombre=${encodeURIComponent(texto)}`);
      if (resultadosBusquedaExistente.length === 0) {
        div.innerHTML = `<p style="color:var(--muted); font-size:13px">Sin resultados</p>`;
        return;
      }
      div.innerHTML = "";
      resultadosBusquedaExistente.forEach(p => {
        div.innerHTML += `
          <div class="item">
            <div>
              ${p.nombre}
              <small>Stock actual: ${p.stockActual}</small>
            </div>
            <div style="display:flex; gap:8px; align-items:center">
              <div class="stepper" style="margin-bottom:0">
                <button type="button" class="secundario btn-cantidad" onclick="cambiarCantidadExistente(${p.id}, -1)">−</button>
                <input type="number" min="1" value="1" id="cantidadExistente-${p.id}" class="stepper-input">
                <button type="button" class="secundario btn-cantidad" onclick="cambiarCantidadExistente(${p.id}, 1)">+</button>
              </div>
              <button onclick="sumarStockExistente(${p.id})">Sumar</button>
            </div>
          </div>`;
      });
    } catch (e) {
      div.innerHTML = `<div class="msg error"><i class="bi bi-exclamation-circle-fill"></i><span>${e.message}</span></div>`;
    }
  }, 300);
}

function cambiarCantidadExistente(id, delta) {
  const input = document.getElementById(`cantidadExistente-${id}`);
  input.value = Math.max(1, (parseInt(input.value, 10) || 1) + delta);
}

async function sumarStockExistente(id) {
  const producto = resultadosBusquedaExistente.find(p => p.id === id);
  if (!producto) return;

  const cantidad = parseInt(document.getElementById(`cantidadExistente-${id}`).value, 10);
  if (!cantidad || cantidad < 1) {
    mostrarMensajeEn("mensaje", "Cantidad invalida", "error");
    return;
  }

  await registrarEntradaRapida(producto.codigoBarras, cantidad, "Entrada manual (codigo distinto por unidad)");
  document.getElementById("buscarProductoExistente").value = "";
  document.getElementById("resultadosBusquedaExistente").innerHTML = "";
}

// ---------- FORMULARIO DE PRODUCTO NUEVO ----------
// "Unidades por caja" solo tiene sentido si hay codigo de caja: se muestra
// al escribirlo y se oculta (y se limpia) si lo borran.
function actualizarFilaUnidadesCaja() {
  const hayCodigo = document.getElementById("nuevoCodigoCaja").value.trim() !== "";
  document.getElementById("filaUnidadesCaja").classList.toggle("oculto", !hayCodigo);
  if (!hayCodigo) document.getElementById("nuevoUnidadesPorCaja").value = "";
}

function abrirFormularioProductoNuevo(codigo) {
  formularioEsManual = false;
  codigoFormularioActual = codigo;
  document.getElementById("nuevoCodigoBarras").value = codigo;
  document.getElementById("nuevoCategoria").value = document.getElementById("categoriaSesion").value;
  document.getElementById("nuevoNombre").value = "";
  document.getElementById("nuevoPrecioVenta").value = "";
  document.getElementById("nuevoPrecioCompra").value = "";
  document.getElementById("nuevoStockActual").value = "1";
  document.getElementById("nuevoStockMinimo").value = "5";
  document.getElementById("nuevoCodigoCaja").value = "";
  document.getElementById("nuevoUnidadesPorCaja").value = "";
  actualizarFilaUnidadesCaja();
  document.getElementById("cardProductoNuevo").classList.remove("oculto");
  mostrarMensajeEn("mensaje", "Codigo nuevo, completa los datos del producto", "ok");
}

function abrirFormularioManual() {
  abrirFormularioProductoNuevo(`MANUAL-${Date.now()}`);
  formularioEsManual = true;
}

function cerrarFormularioNuevo() {
  document.getElementById("cardProductoNuevo").classList.add("oculto");
  codigoFormularioActual = null;
}

async function guardarProductoNuevo() {
  const nombre = document.getElementById("nuevoNombre").value.trim();
  const precioVenta = parseFloat(document.getElementById("nuevoPrecioVenta").value);
  const precioCompraTexto = document.getElementById("nuevoPrecioCompra").value;
  const stockActual = parseInt(document.getElementById("nuevoStockActual").value, 10);
  const stockMinimo = parseInt(document.getElementById("nuevoStockMinimo").value, 10);
  const categoriaId = document.getElementById("nuevoCategoria").value;
  const codigoCaja = document.getElementById("nuevoCodigoCaja").value.trim();
  const unidadesPorCajaTexto = document.getElementById("nuevoUnidadesPorCaja").value;
  const vendidoPorPeso = document.getElementById("nuevoVendidoPorPeso").checked;

  if (!categoriaId) {
    mostrarMensajeEn("mensaje", "Elige una categoria: un producto sin categoria queda suelto y no se registra", "error");
    return;
  }
  if (!nombre) {
    mostrarMensajeEn("mensaje", "Falta el nombre del producto", "error");
    return;
  }
  if (!precioVenta || precioVenta <= 0) {
    mostrarMensajeEn("mensaje", "Precio de venta invalido", "error");
    return;
  }
  if (!vendidoPorPeso && (!stockActual || stockActual < 1)) {
    mostrarMensajeEn("mensaje", "Cantidad inicial invalida", "error");
    return;
  }
  if (codigoCaja && (!unidadesPorCajaTexto || parseInt(unidadesPorCajaTexto, 10) < 1)) {
    mostrarMensajeEn("mensaje", "Indica cuantas unidades trae la caja", "error");
    return;
  }

  const body = {
    codigoBarras: codigoFormularioActual,
    nombre,
    precioVenta,
    precioCompra: precioCompraTexto ? parseFloat(precioCompraTexto) : null,
    stockActual: vendidoPorPeso ? 0 : stockActual,
    stockMinimo: vendidoPorPeso ? 0 : (Number.isNaN(stockMinimo) ? 5 : stockMinimo),
    categoria: { id: parseInt(categoriaId, 10) },
    codigoBarrasCaja: codigoCaja || null,
    unidadesPorCaja: unidadesPorCajaTexto ? parseInt(unidadesPorCajaTexto, 10) : null,
    vendidoPorPeso
  };

  try {
    const conCaja = pagadoConCajaMarcado();
    const producto = await apiFetch(`/productos?pagadoConCaja=${conCaja}`, { method: "POST", body: JSON.stringify(body) });
    const sinCosto = conCaja && !vendidoPorPeso && !(Number(producto.precioCompra) > 0);
    mostrarMensajeEn("mensaje",
      sinCosto
        ? `Producto creado: ${producto.nombre}. Ojo: sin precio de compra no se descontó plata de la caja`
        : `Producto creado: ${producto.nombre}${conCaja && !vendidoPorPeso ? " (compra registrada)" : ""}`,
      sinCosto ? "info" : "ok");
    cerrarFormularioNuevo();

    // Si no tiene un codigo fisico real, ofrecemos imprimir la etiqueta generada
    // para poder pegarla en el producto y que quede escaneable a futuro.
    if (formularioEsManual) {
      const res = await fetch(`${API_BASE}/productos/${producto.id}/codigo-barras`, {
        headers: { "Authorization": `Bearer ${getToken()}` }
      });
      const blob = await res.blob();
      const ventana = window.open(URL.createObjectURL(blob), "_blank");
    }
  } catch (e) {
    mostrarMensajeEn("mensaje", e.message, "error");
  }
}

iniciarCamara();
</script>
