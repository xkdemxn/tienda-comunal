<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vender</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  .total {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: 700;
    margin-top: 12px;
  }
  .total small {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
  }
  .resultados-busqueda .item button {
    width: auto;
    padding: 8px 12px;
    margin-bottom: 0;
  }
</style>
</head>
<body>

<div class="app">
  <div id="fondoSidebarMovil" class="fondo-sidebar-movil"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header"><i class="bi bi-shop"></i> Tienda</div>
    <nav class="sidebar-nav">
      <a href="dashboard" data-pagina="inicio">Inicio</a>
      <a href="venta" data-pagina="venta">Vender</a>
      <a href="agregar-stock" data-pagina="agregar-stock" data-solo-admin="1">Agregar stock</a>
      <a href="deudores" data-pagina="deudores">Fiar</a>

      <button class="grupo-toggle" data-grupo="catalogo" data-solo-admin="1" onclick="toggleGrupo('catalogo')">
        <span>Catalogo</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-catalogo" data-grupo="catalogo">
        <a href="categorias" data-pagina="categorias" data-solo-admin="1">Categorias</a>
        <a href="productos" data-pagina="productos" data-solo-admin="1">Productos</a>
      </div>

      <button class="grupo-toggle" data-grupo="abastecimiento" data-solo-admin="1" onclick="toggleGrupo('abastecimiento')">
        <span>Abastecimiento</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-abastecimiento" data-grupo="abastecimiento">
        <a href="proveedores" data-pagina="proveedores" data-solo-admin="1">Proveedores</a>
        <a href="compras" data-pagina="compras" data-solo-admin="1">Compras</a>
        <a href="caducados" data-pagina="caducados" data-solo-admin="1">Caducados</a>
      </div>

      <button class="grupo-toggle" data-grupo="reportes" data-solo-admin="1" onclick="toggleGrupo('reportes')">
        <span>Reportes</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-reportes" data-grupo="reportes">
        <a href="historial-ventas" data-pagina="historial-ventas" data-solo-admin="1">Historial de ventas</a>
        <a href="estadisticas" data-pagina="estadisticas" data-solo-admin="1">Estadisticas</a>
        <a href="fiscalizacion" data-pagina="fiscalizacion" data-solo-admin="1">Fiscalizacion</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="nombre" id="sidebarNombre"></div>
      <div class="rol" id="sidebarRol"></div>
      <button onclick="logout()">Cerrar sesion</button>
    </div>
  </aside>

  <div class="contenido">
    <div class="topbar">
      <button id="btnHamburguesa" class="btn-hamburguesa"><i class="bi bi-list"></i></button>
      <h1>Vender</h1>
    </div>
    <div class="pagina">

      <div class="card">
        <div id="reader"></div>
        <div class="controles-camara">
          <button class="secundario" onclick="reiniciarCamara()">Reiniciar</button>
          <button class="secundario" id="btnFlash" onclick="toggleFlash()"><i class="bi bi-lightning-charge-fill"></i> Flash</button>
          <button class="secundario" onclick="enfocarCamara()"><i class="bi bi-crosshair"></i> Enfocar</button>
        </div>
      </div>

      <div id="mensaje"></div>

      <div class="card">
        <label class="campo">Producto sin codigo de barras (ej: pan)</label>
        <input type="text" id="buscarProductoVenta" placeholder="Buscar por nombre..." oninput="buscarProductoParaVenta()">
        <div id="resultadosBusquedaVenta" class="resultados-busqueda"></div>
      </div>

      <div class="card">
        <strong>Carrito</strong>
        <div id="carrito"></div>
        <div class="total">
          <span>Total <small id="unidadesCarrito">0 productos</small></span>
          <span id="totalCarrito">$0.00</span>
        </div>
      </div>

      <div class="card">
        <button onclick="confirmarVenta()">Confirmar venta</button>
        <button class="secundario" onclick="vaciarCarrito()">Vaciar carrito</button>
      </div>

    </div>
  </div>
</div>

<script src="dashboard.js"></script>
<script>
initSidebar("venta");

let carrito = []; // { codigoBarras, nombre, precio, cantidad }
let html5QrCode;
let escaneando = false;
let flashActivo = false;
let ultimoCodigo = "";
let ultimoTiempo = 0;
let temporizadorBusqueda;

// ---------- CAMARA / ESCANEO ----------
async function iniciarCamara() {
  if (escaneando) return;
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 250, height: 120 } };
  const camara = await obtenerCamaraTrasera();

  html5QrCode.start(
    camara,
    config,
    onCodigoDetectado,
    () => {}
  ).then(() => { escaneando = true; });
}

function reiniciarCamara() {
  flashActivo = false;
  document.getElementById("btnFlash").classList.remove("activo");
  if (html5QrCode && escaneando) {
    html5QrCode.stop().then(() => {
      escaneando = false;
      iniciarCamara();
    });
  } else {
    iniciarCamara();
  }
}

async function toggleFlash() {
  if (!html5QrCode || !escaneando) return;
  const encender = !flashActivo;
  try {
    await html5QrCode.applyVideoConstraints({
      torch: encender,
      advanced: [{ torch: encender }]
    });
    const settings = html5QrCode.getRunningTrackSettings();
    if (settings.torch !== encender) throw new Error("No soportado");
    flashActivo = encender;
    document.getElementById("btnFlash").classList.toggle("activo", flashActivo);
  } catch (e) {
    mostrarMensajeEn("mensaje", "Tu camara no permite controlar el flash desde el navegador", "error");
  }
}

async function enfocarCamara() {
  if (!html5QrCode || !escaneando) return;
  try {
    await html5QrCode.applyVideoConstraints({ advanced: [{ focusMode: "continuous" }] });
    mostrarMensajeEn("mensaje", "Enfoque ajustado", "ok");
  } catch (e) {
    mostrarMensajeEn("mensaje", "Tu camara no permite ajustar el enfoque manualmente", "error");
  }
}

async function onCodigoDetectado(codigo) {
  const ahora = Date.now();
  if (codigo === ultimoCodigo && ahora - ultimoTiempo < 2000) return;
  ultimoCodigo = codigo;
  ultimoTiempo = ahora;

  try {
    const producto = await apiFetch(`/escaneo/${codigo}`);

    if (!producto.stockSuficiente) {
      mostrarMensajeEn("mensaje", `"${producto.nombre}" no tiene stock disponible`, "error");
      return;
    }

    agregarAlCarrito(producto);
    mostrarMensajeEn("mensaje", `Agregado: ${producto.nombre}`, "ok");
  } catch (e) {
    mostrarMensajeEn("mensaje", e.message, "error");
  }
}


function agregarAlCarrito(producto, cantidadInicial = 1) {
  const existente = carrito.find(i => i.codigoBarras === producto.codigoBarras);
  if (existente) {
    existente.cantidad += cantidadInicial;
  } else {
    carrito.push({
      codigoBarras: producto.codigoBarras,
      nombre: producto.nombre,
      precio: producto.precioVenta,
      cantidad: cantidadInicial
    });
  }
  renderCarrito();
}

function renderCarrito() {
  const div = document.getElementById("carrito");
  div.innerHTML = "";
  let total = 0;
  let unidades = 0;

  carrito.forEach((item, idx) => {
    if (item.esPeso) {
      const subtotal = item.precio * item.peso;
      total += subtotal;
      unidades += 1;
      div.innerHTML += `
        <div class="item">
          <div>
            ${item.nombre}
            <small>${item.peso} lb x $${item.precio.toFixed(2)}/lb</small>
          </div>
          <div style="display:flex; align-items:center; gap:8px">
            <span>$${subtotal.toFixed(2)}</span>
            <button class="secundario" style="width:auto; padding:4px 8px"
                    onclick="quitarDelCarrito(${idx})"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>`;
      return;
    }

    const subtotal = item.precio * item.cantidad;
    total += subtotal;
    unidades += item.cantidad;
    div.innerHTML += `
      <div class="item">
        <div>
          ${item.nombre}
          <small>$${item.precio.toFixed(2)} c/u</small>
        </div>
        <div style="display:flex; align-items:center; gap:8px">
          <input type="number" min="1" value="${item.cantidad}" style="width:60px; margin-bottom:0"
                 onchange="actualizarCantidadCarrito(${idx}, this.value)">
          <span>$${subtotal.toFixed(2)}</span>
          <button class="secundario" style="width:auto; padding:4px 8px"
                  onclick="quitarDelCarrito(${idx})"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>`;
  });

  document.getElementById("totalCarrito").innerText = `$${total.toFixed(2)}`;
  document.getElementById("unidadesCarrito").innerText =
    `${unidades} producto${unidades === 1 ? "" : "s"}`;
}

function actualizarCantidadCarrito(idx, valor) {
  const cantidad = parseInt(valor, 10);
  if (!cantidad || cantidad < 1) {
    renderCarrito(); // revierte el input a su valor anterior
    return;
  }
  carrito[idx].cantidad = cantidad;
  renderCarrito();
}

function quitarDelCarrito(idx) {
  carrito.splice(idx, 1);
  renderCarrito();
}

function vaciarCarrito() {
  carrito = [];
  renderCarrito();
}

// ---------- BUSQUEDA MANUAL (productos sin codigo de barras, ej: pan) ----------
function buscarProductoParaVenta() {
  clearTimeout(temporizadorBusqueda);
  const texto = document.getElementById("buscarProductoVenta").value.trim();
  const div = document.getElementById("resultadosBusquedaVenta");

  if (texto.length < 2) {
    div.innerHTML = "";
    return;
  }

  temporizadorBusqueda = setTimeout(async () => {
    try {
      const productos = await apiFetch(`/productos/buscar?nombre=${encodeURIComponent(texto)}`);
      if (productos.length === 0) {
        div.innerHTML = `<p style="color:var(--muted); font-size:13px; margin:8px 0 0">Sin resultados</p>`;
        return;
      }

      div.innerHTML = "";
      productos.forEach(p => {
        const infoStock = p.vendidoPorPeso
          ? `$${Number(p.precioVenta).toFixed(2)} / libra`
          : `Stock: ${p.stockActual} · $${Number(p.precioVenta).toFixed(2)} c/u`;
        const acciones = p.vendidoPorPeso
          ? `<button onclick="agregarPorPeso(${p.id})">Pesar</button>`
          : `
            <div style="display:flex; gap:6px">
              <button class="secundario" style="width:auto; padding:8px 10px"
                      onclick="agregarPorMonto(${p.id})" title="Vender por monto en dolares">$</button>
              <button onclick="agregarProductoBuscado(${p.id})">Agregar</button>
            </div>`;
        div.innerHTML += `
          <div class="item">
            <div>
              ${p.nombre}
              <small>${infoStock}</small>
            </div>
            ${acciones}
          </div>`;
      });
      window.__resultadosBusqueda = productos;
    } catch (e) {
      div.innerHTML = `<div class="msg error">${e.message}</div>`;
    }
  }, 300);
}

// Vender "$1 de pan": pide un monto, calcula cuantas unidades ENTERAS entran
// (redondeando hacia abajo) y las agrega. El sobrante (ej: $1 -> 6 panes de
// $0.15 = $0.90, sobran $0.10) no se registra como vuelto, es una diferencia
// de caja informal que el tendero decide como manejar.
function agregarPorMonto(id) {
  const producto = (window.__resultadosBusqueda || []).find(p => p.id === id);
  if (!producto) return;

  const montoTexto = prompt(`¿Cuantos dolares de "${producto.nombre}" ($${Number(producto.precioVenta).toFixed(2)} c/u)?`);
  if (!montoTexto) return;

  const monto = parseFloat(montoTexto);
  if (!monto || monto <= 0) {
    mostrarMensajeEn("mensaje", "Ingresa un monto valido", "error");
    return;
  }

  const cantidad = Math.floor(monto / producto.precioVenta);
  if (cantidad < 1) {
    mostrarMensajeEn("mensaje",
      `$${monto.toFixed(2)} no alcanza para ni una unidad de "${producto.nombre}"`, "error");
    return;
  }

  agregarAlCarrito({
    codigoBarras: producto.codigoBarras,
    nombre: producto.nombre,
    precioVenta: producto.precioVenta
  }, cantidad);

  mostrarMensajeEn("mensaje", `Agregado: ${cantidad} x ${producto.nombre} (por $${monto.toFixed(2)})`, "ok");
  document.getElementById("buscarProductoVenta").value = "";
  document.getElementById("resultadosBusquedaVenta").innerHTML = "";
}

// Productos vendidos por peso (ej: carne): cada pesada es una linea nueva
// del carrito, no se suma a una existente como con las unidades enteras.
function agregarPorPeso(id) {
  const producto = (window.__resultadosBusqueda || []).find(p => p.id === id);
  if (!producto) return;

  const pesoTexto = prompt(`¿Cuantas libras de "${producto.nombre}" ($${Number(producto.precioVenta).toFixed(2)}/lb)?`);
  if (!pesoTexto) return;

  const peso = parseFloat(pesoTexto);
  if (!peso || peso <= 0) {
    mostrarMensajeEn("mensaje", "Ingresa un peso valido", "error");
    return;
  }

  carrito.push({
    codigoBarras: producto.codigoBarras,
    nombre: producto.nombre,
    precio: producto.precioVenta,
    peso,
    esPeso: true
  });
  renderCarrito();

  mostrarMensajeEn("mensaje", `Agregado: ${peso} lb de ${producto.nombre}`, "ok");
  document.getElementById("buscarProductoVenta").value = "";
  document.getElementById("resultadosBusquedaVenta").innerHTML = "";
}

function agregarProductoBuscado(id) {
  const producto = (window.__resultadosBusqueda || []).find(p => p.id === id);
  if (!producto) return;

  agregarAlCarrito({
    codigoBarras: producto.codigoBarras,
    nombre: producto.nombre,
    precioVenta: producto.precioVenta
  });
  mostrarMensajeEn("mensaje", `Agregado: ${producto.nombre}`, "ok");
  document.getElementById("buscarProductoVenta").value = "";
  document.getElementById("resultadosBusquedaVenta").innerHTML = "";
}

// ---------- CONFIRMAR VENTA ----------
async function confirmarVenta() {
  if (carrito.length === 0) {
    mostrarMensajeEn("mensaje", "El carrito esta vacio", "error");
    return;
  }

  const body = {
    items: carrito.map(i => i.esPeso
      ? { codigoBarras: i.codigoBarras, peso: i.peso }
      : { codigoBarras: i.codigoBarras, cantidad: i.cantidad })
  };

  try {
    const venta = await apiFetch("/ventas", { method: "POST", body: JSON.stringify(body) });
    mostrarMensajeEn("mensaje", `Venta registrada: $${venta.totalMonedaLocal}`, "ok");
    vaciarCarrito();
  } catch (e) {
    mostrarMensajeEn("mensaje", e.message, "error");
  }
}

iniciarCamara();
</script>

</body>
</html>
