<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vender</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  /* ---------- Layout de dos columnas en pantallas grandes: escanear/buscar
     a la izquierda, carrito siempre visible (sticky) a la derecha - como en
     un POS de verdad, en vez de una sola columna larga para desplazarse. */
  .venta-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
    align-items: start;
  }
  .venta-col-derecha { position: sticky; top: 86px; }
  @media (max-width: 960px) {
    .venta-layout { grid-template-columns: 1fr; }
    .venta-col-derecha { position: static; }
  }

  .resultados-busqueda .item button {
    width: auto;
    padding: 8px 12px;
    margin-bottom: 0;
  }

  /* Barra fija abajo en celular: total + confirmar siempre a la vista, sin
     tener que bajar hasta el final para cobrar. Solo aparece en movil,
     donde el carrito ya no queda pegado (sticky) como en desktop. */
  .venta-barra-fija { display: none; }
  @media (max-width: 960px) {
    .pagina-venta { padding-bottom: 180px; }
    .venta-barra-fija {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: fixed;
      left: 12px;
      right: 12px;
      /* Encima de la barra de navegacion inferior (que en celular mide
         unos 70-90px con el "safe area" del notch), no pegada al fondo. */
      bottom: calc(78px + env(safe-area-inset-bottom));
      background: #ffffff;
      border-radius: 16px;
      padding: 10px 10px 10px 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
      z-index: 15;
    }
    .venta-barra-fija strong { display: block; font-size: 18px; color: var(--accent); }
    .venta-barra-fija small { color: var(--muted); font-size: 11px; }
    .venta-barra-fija button {
      width: auto;
      margin-bottom: 0;
      padding: 12px 20px;
      white-space: nowrap;
    }
  }
</style>
</head>
<body>

<div class="app">
  <div id="fondoSidebarMovil" class="fondo-sidebar-movil"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header"><i class="bi bi-shop"></i> Tienda</div>
    <nav class="sidebar-nav">
      <a href="dashboard" data-pagina="inicio"><span class="nav-icono g-azul"><i class="bi bi-house-door"></i></span><span class="nav-texto">Inicio</span></a>
      <a href="venta" data-pagina="venta"><span class="nav-icono g-verde"><i class="bi bi-cart3"></i></span><span class="nav-texto">Vender</span></a>
      <a href="agregar-stock" data-pagina="agregar-stock"><span class="nav-icono g-cian"><i class="bi bi-plus-circle"></i></span><span class="nav-texto">Agregar stock</span></a>
      <a href="deudores" data-pagina="deudores"><span class="nav-icono g-rosa"><i class="bi bi-people"></i></span><span class="nav-texto">Fiar</span></a>
      <a href="historial-ventas" data-pagina="historial-ventas"><span class="nav-icono g-naranja"><i class="bi bi-clock-history"></i></span><span class="nav-texto">Historial de ventas</span></a>

      <button class="grupo-toggle" data-grupo="catalogo" data-solo-admin="1" onclick="toggleGrupo('catalogo')">
        <span class="nav-icono g-morado"><i class="bi bi-grid"></i></span><span class="nav-texto">Catalogo</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-catalogo" data-grupo="catalogo">
        <a href="categorias" data-pagina="categorias" data-solo-admin="1"><span class="nav-icono g-morado"><i class="bi bi-tags"></i></span><span class="nav-texto">Categorias</span></a>
        <a href="productos" data-pagina="productos" data-solo-admin="1"><span class="nav-icono g-teal"><i class="bi bi-box-seam"></i></span><span class="nav-texto">Productos</span></a>
      </div>

      <button class="grupo-toggle" data-grupo="abastecimiento" data-solo-admin="1" onclick="toggleGrupo('abastecimiento')">
        <span class="nav-icono g-indigo"><i class="bi bi-truck"></i></span><span class="nav-texto">Abastecimiento</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-abastecimiento" data-grupo="abastecimiento">
        <a href="proveedores" data-pagina="proveedores" data-solo-admin="1"><span class="nav-icono g-indigo"><i class="bi bi-truck"></i></span><span class="nav-texto">Proveedores</span></a>
        <a href="compras" data-pagina="compras" data-solo-admin="1"><span class="nav-icono g-ambar"><i class="bi bi-receipt"></i></span><span class="nav-texto">Compras</span></a>
        <a href="caducados" data-pagina="caducados" data-solo-admin="1"><span class="nav-icono g-rojo"><i class="bi bi-exclamation-triangle"></i></span><span class="nav-texto">Caducados</span></a>
      </div>

      <button class="grupo-toggle" data-grupo="reportes" data-solo-admin="1" onclick="toggleGrupo('reportes')">
        <span class="nav-icono g-azul"><i class="bi bi-graph-up"></i></span><span class="nav-texto">Reportes</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-reportes" data-grupo="reportes">
        <a href="estadisticas" data-pagina="estadisticas" data-solo-admin="1"><span class="nav-icono g-azul"><i class="bi bi-bar-chart-line"></i></span><span class="nav-texto">Estadisticas</span></a>
        <a href="fiscalizacion" data-pagina="fiscalizacion" data-solo-admin="1"><span class="nav-icono g-violeta"><i class="bi bi-clipboard-data"></i></span><span class="nav-texto">Fiscalizacion</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="perfil-mini">
        <span class="avatar-mini" id="sidebarAvatar">?</span>
        <div class="perfil-mini-textos">
          <div class="nombre" id="sidebarNombre"></div>
          <div class="rol" id="sidebarRol"></div>
        </div>
      </div>
      <button onclick="logout()"><i class="bi bi-box-arrow-right"></i> Cerrar sesion</button>
    </div>
  </aside>

  <div class="contenido">
    <div class="topbar">
      <button id="btnHamburguesa" class="btn-hamburguesa"><i class="bi bi-list"></i></button>
      <h1>Vender</h1>
    </div>
    <div class="pagina pagina-venta">

      <div class="venta-layout">
        <div class="venta-col-izquierda">
          <div class="card">
            <div id="reader"></div>
            <div style="margin-top: 10px;" class="controles-camara">
              <button class="secundario" onclick="reiniciarCamara()" title="Reiniciar la camara si se congela o no enfoca">
                <i class="bi bi-arrow-clockwise"></i> Reiniciar
              </button>
              <button class="secundario" id="btnFlash" onclick="toggleFlash()" title="Encender/apagar el flash">
                <i class="bi bi-lightning-charge-fill"></i> Flash
              </button>
            </div>
          </div>

          <div id="mensaje"></div>

          <div class="card">
            <label class="campo">Producto sin codigo de barras</label>
            <input type="text" id="buscarProductoVenta" placeholder="Buscar por nombre..." oninput="buscarProductoParaVenta()">
            <div id="resultadosBusquedaVenta" class="resultados-busqueda"></div>
          </div>
        </div>

        <div class="venta-col-derecha">
          <div class="card">
            <strong><i class="bi bi-cart3"></i> Carrito</strong>
            <div id="carrito"></div>
            <div class="total">
              <span>Total <small id="unidadesCarrito">0 productos</small></span>
              <span id="totalCarrito">$0.00</span>
            </div>

            <label class="campo" style="margin-top:10px">Recibido del cliente (opcional)</label>
            <input type="number" min="0" step="0.01" id="montoRecibido" placeholder="Monto Recibido" oninput="calcularVuelto()">
            <div class="total oculto" id="filaVuelto">
              <span id="etiquetaVuelto">Vuelto</span>
              <span id="montoVuelto">$0.00</span>
            </div>
          </div>

          <div class="card">
            <button onclick="confirmarVenta()">Confirmar venta</button>
            <button class="secundario" style="margin-top: 10px;" onclick="vaciarCarrito()">Vaciar carrito</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="venta-barra-fija" id="barraFijaVenta">
  <div>
    <small id="barraFijaUnidades">0 productos</small>
    <strong id="barraFijaTotal">$0.00</strong>
  </div>
  <button onclick="confirmarVenta()"><i class="bi bi-check-lg"></i> Confirmar venta</button>
</div>

<nav class="barra-inferior">
  <a href="dashboard" data-pagina="inicio"><i class="bi bi-house-door"></i><span>Inicio</span></a>
  <a href="agregar-stock" data-pagina="agregar-stock"><i class="bi bi-plus-circle"></i><span>Stock</span></a>
  <a href="venta" data-pagina="venta" class="accion-principal"><i class="bi bi-cart3"></i></a>
  <a href="deudores" data-pagina="deudores"><i class="bi bi-people"></i><span>Fiar</span></a>
  <button type="button" id="btnMasMovil"><i class="bi bi-grid-3x3-gap"></i><span>Mas</span></button>
</nav>

<script src="dashboard.js"></script>
<script>
initSidebar("venta");

let carrito = []; // { codigoBarras, nombre, precio, cantidad }
let totalCarritoActual = 0;
let html5QrCode;
let escaneando = false;
let flashActivo = false;
let ultimoCodigo = "";
let ultimoTiempo = 0;
let temporizadorBusqueda;

// ---------- CAMARA / ESCANEO ----------
async function iniciarCamara() {
  if (escaneando) return;
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 250, height: 120 } };
  const camara = await obtenerCamaraTrasera();

  html5QrCode.start(
    camara,
    config,
    onCodigoDetectado,
    () => {}
  ).then(() => { escaneando = true; });
}

function reiniciarCamara() {
  flashActivo = false;
  document.getElementById("btnFlash").classList.remove("activo");
  if (html5QrCode && escaneando) {
    html5QrCode.stop().then(() => {
      escaneando = false;
      iniciarCamara();
    });
  } else {
    iniciarCamara();
  }
}

async function toggleFlash() {
  if (!html5QrCode || !escaneando) return;
  const encender = !flashActivo;
  try {
    await html5QrCode.applyVideoConstraints({
      torch: encender,
      advanced: [{ torch: encender }]
    });
    const settings = html5QrCode.getRunningTrackSettings();
    if (settings.torch !== encender) throw new Error("No soportado");
    flashActivo = encender;
    document.getElementById("btnFlash").classList.toggle("activo", flashActivo);
  } catch (e) {
    mostrarMensajeEn("mensaje", "Tu camara no permite controlar el flash desde el navegador", "error");
  }
}

async function onCodigoDetectado(codigo) {
  const ahora = Date.now();
  if (codigo === ultimoCodigo && ahora - ultimoTiempo < 2000) return;
  ultimoCodigo = codigo;
  ultimoTiempo = ahora;

  try {
    const producto = await apiFetch(`/escaneo/${codigo}`);

    if (!producto.stockSuficiente) {
      mostrarMensajeEn("mensaje", `"${producto.nombre}" no tiene stock disponible`, "error");
      return;
    }

    agregarAlCarrito(producto);
    mostrarMensajeEn("mensaje", `Agregado: ${producto.nombre}`, "ok");
  } catch (e) {
    mostrarMensajeEn("mensaje", e.message, "error");
  }
}


function agregarAlCarrito(producto, cantidadInicial = 1) {
  const existente = carrito.find(i => i.codigoBarras === producto.codigoBarras);
  if (existente) {
    existente.cantidad += cantidadInicial;
  } else {
    carrito.push({
      codigoBarras: producto.codigoBarras,
      nombre: producto.nombre,
      precio: producto.precioVenta,
      cantidad: cantidadInicial
    });
  }
  renderCarrito();
}

function renderCarrito() {
  const div = document.getElementById("carrito");
  div.innerHTML = "";
  let total = 0;
  let unidades = 0;

  if (carrito.length === 0) {
    div.innerHTML = `<div class="estado-vacio"><i class="bi bi-cart-x"></i>Aun no has agregado productos</div>`;
  }

  carrito.forEach((item, idx) => {
    if (item.esPeso) {
      const subtotal = item.precio * item.peso;
      total += subtotal;
      unidades += 1;
      div.innerHTML += `
        <div class="item item-carrito">
          <div class="item-carrito-info">
            <div class="item-carrito-nombre">${item.nombre}</div>
            <small>${item.peso} lb x $${item.precio.toFixed(2)}/lb</small>
          </div>
          <div class="item-carrito-controles">
            <span class="item-carrito-subtotal">$${subtotal.toFixed(2)}</span>
            <button class="secundario btn-cantidad" onclick="quitarDelCarrito(${idx})"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>`;
      return;
    }

    const subtotal = item.precio * item.cantidad;
    total += subtotal;
    unidades += item.cantidad;
    div.innerHTML += `
      <div class="item item-carrito">
        <div class="item-carrito-info">
          <div class="item-carrito-nombre">${item.nombre}</div>
          <small>$${item.precio.toFixed(2)} c/u</small>
        </div>
        <div class="item-carrito-controles">
          <button class="secundario btn-cantidad" onclick="cambiarCantidadCarrito(${idx}, -1)">−</button>
          <span class="cantidad-valor">${item.cantidad}</span>
          <button class="secundario btn-cantidad" onclick="cambiarCantidadCarrito(${idx}, 1)">+</button>
          <span class="item-carrito-subtotal">$${subtotal.toFixed(2)}</span>
        </div>
      </div>`;
  });

  document.getElementById("totalCarrito").innerText = `$${total.toFixed(2)}`;
  document.getElementById("unidadesCarrito").innerText =
    `${unidades} producto${unidades === 1 ? "" : "s"}`;

  // Barra fija de celular: mismo total/unidades, siempre visible sin
  // depender de que el carrito quede "pegado" (eso solo pasa en desktop).
  document.getElementById("barraFijaTotal").innerText = `$${total.toFixed(2)}`;
  document.getElementById("barraFijaUnidades").innerText =
    `${unidades} producto${unidades === 1 ? "" : "s"}`;

  totalCarritoActual = total;
  calcularVuelto();
}

// Vuelto: campo opcional, no bloquea "Confirmar venta" si el cajero no lo
// usa (muchas ventas son con monto exacto o tarjeta). Si lo recibido no
// alcanza, se avisa como "Falta" en vez de un vuelto negativo confuso.
function calcularVuelto() {
  const recibidoTexto = document.getElementById("montoRecibido").value;
  const filaVuelto = document.getElementById("filaVuelto");

  if (!recibidoTexto || isNaN(parseFloat(recibidoTexto))) {
    filaVuelto.classList.add("oculto");
    return;
  }

  const recibido = parseFloat(recibidoTexto);
  const diferencia = recibido - totalCarritoActual;
  const montoVueltoEl = document.getElementById("montoVuelto");

  filaVuelto.classList.remove("oculto");
  document.getElementById("etiquetaVuelto").innerText = diferencia < 0 ? "Falta" : "Vuelto";
  montoVueltoEl.innerText = `$${Math.abs(diferencia).toFixed(2)}`;
  montoVueltoEl.style.color = diferencia < 0 ? "var(--danger)" : "var(--accent)";
}

function cambiarCantidadCarrito(idx, delta) {
  const nuevaCantidad = carrito[idx].cantidad + delta;
  if (nuevaCantidad < 1) {
    carrito.splice(idx, 1); // llego a 0: se quita del carrito
  } else {
    carrito[idx].cantidad = nuevaCantidad;
  }
  renderCarrito();
}

function quitarDelCarrito(idx) {
  carrito.splice(idx, 1);
  renderCarrito();
}

function vaciarCarrito() {
  carrito = [];
  document.getElementById("montoRecibido").value = "";
  renderCarrito();
}

// ---------- BUSQUEDA MANUAL (productos sin codigo de barras, ej: pan) ----------
function buscarProductoParaVenta() {
  clearTimeout(temporizadorBusqueda);
  const texto = document.getElementById("buscarProductoVenta").value.trim();
  const div = document.getElementById("resultadosBusquedaVenta");

  if (texto.length < 2) {
    div.innerHTML = "";
    return;
  }

  temporizadorBusqueda = setTimeout(async () => {
    try {
      const productos = await apiFetch(`/productos/buscar?nombre=${encodeURIComponent(texto)}`);
      if (productos.length === 0) {
        div.innerHTML = `<p style="color:var(--muted); font-size:13px; margin:8px 0 0">Sin resultados</p>`;
        return;
      }

      div.innerHTML = "";
      productos.forEach(p => {
        const infoStock = p.vendidoPorPeso
          ? `$${Number(p.precioVenta).toFixed(2)} / libra`
          : `Stock: ${p.stockActual} · $${Number(p.precioVenta).toFixed(2)} c/u`;
        const acciones = p.vendidoPorPeso
          ? `<button onclick="agregarPorPeso(${p.id})">Pesar</button>`
          : `
            <div style="display:flex; gap:6px">
              <button class="secundario" style="width:auto; padding:8px 10px"
                      onclick="agregarPorMonto(${p.id})" title="Vender por monto en dolares">$</button>
              <button onclick="agregarProductoBuscado(${p.id})">Agregar</button>
            </div>`;
        div.innerHTML += `
          <div class="item">
            <div>
              ${p.nombre}
              <small>${infoStock}</small>
            </div>
            ${acciones}
          </div>`;
      });
      window.__resultadosBusqueda = productos;
    } catch (e) {
      div.innerHTML = `<div class="msg error"><i class="bi bi-exclamation-circle-fill"></i><span>${e.message}</span></div>`;
    }
  }, 300);
}

// Vender "$1 de pan": pide un monto, calcula cuantas unidades ENTERAS entran
// (redondeando hacia abajo) y las agrega. El sobrante (ej: $1 -> 6 panes de
// $0.15 = $0.90, sobran $0.10) no se registra como vuelto, es una diferencia
// de caja informal que el tendero decide como manejar.
function agregarPorMonto(id) {
  const producto = (window.__resultadosBusqueda || []).find(p => p.id === id);
  if (!producto) return;

  const montoTexto = prompt(`¿Cuantos dolares de "${producto.nombre}" ($${Number(producto.precioVenta).toFixed(2)} c/u)?`);
  if (!montoTexto) return;

  const monto = parseFloat(montoTexto);
  if (!monto || monto <= 0) {
    mostrarMensajeEn("mensaje", "Ingresa un monto valido", "error");
    return;
  }

  const cantidad = Math.floor(monto / producto.precioVenta);
  if (cantidad < 1) {
    mostrarMensajeEn("mensaje",
      `$${monto.toFixed(2)} no alcanza para ni una unidad de "${producto.nombre}"`, "error");
    return;
  }

  agregarAlCarrito({
    codigoBarras: producto.codigoBarras,
    nombre: producto.nombre,
    precioVenta: producto.precioVenta
  }, cantidad);

  mostrarMensajeEn("mensaje", `Agregado: ${cantidad} x ${producto.nombre} (por $${monto.toFixed(2)})`, "ok");
  document.getElementById("buscarProductoVenta").value = "";
  document.getElementById("resultadosBusquedaVenta").innerHTML = "";
}

// Productos vendidos por peso (ej: carne): cada pesada es una linea nueva
// del carrito, no se suma a una existente como con las unidades enteras.
function agregarPorPeso(id) {
  const producto = (window.__resultadosBusqueda || []).find(p => p.id === id);
  if (!producto) return;

  const pesoTexto = prompt(`¿Cuantas libras de "${producto.nombre}" ($${Number(producto.precioVenta).toFixed(2)}/lb)?`);
  if (!pesoTexto) return;

  const peso = parseFloat(pesoTexto);
  if (!peso || peso <= 0) {
    mostrarMensajeEn("mensaje", "Ingresa un peso valido", "error");
    return;
  }

  carrito.push({
    codigoBarras: producto.codigoBarras,
    nombre: producto.nombre,
    precio: producto.precioVenta,
    peso,
    esPeso: true
  });
  renderCarrito();

  mostrarMensajeEn("mensaje", `Agregado: ${peso} lb de ${producto.nombre}`, "ok");
  document.getElementById("buscarProductoVenta").value = "";
  document.getElementById("resultadosBusquedaVenta").innerHTML = "";
}

function agregarProductoBuscado(id) {
  const producto = (window.__resultadosBusqueda || []).find(p => p.id === id);
  if (!producto) return;

  agregarAlCarrito({
    codigoBarras: producto.codigoBarras,
    nombre: producto.nombre,
    precioVenta: producto.precioVenta
  });
  mostrarMensajeEn("mensaje", `Agregado: ${producto.nombre}`, "ok");
  document.getElementById("buscarProductoVenta").value = "";
  document.getElementById("resultadosBusquedaVenta").innerHTML = "";
}

// ---------- CONFIRMAR VENTA ----------
async function confirmarVenta() {
  if (carrito.length === 0) {
    mostrarMensajeEn("mensaje", "El carrito esta vacio", "error");
    return;
  }

  const body = {
    items: carrito.map(i => i.esPeso
      ? { codigoBarras: i.codigoBarras, peso: i.peso }
      : { codigoBarras: i.codigoBarras, cantidad: i.cantidad })
  };

  try {
    const venta = await apiFetch("/ventas", { method: "POST", body: JSON.stringify(body) });
    mostrarMensajeEn("mensaje", `Venta registrada: $${venta.totalMonedaLocal}`, "ok");
    vaciarCarrito();
  } catch (e) {
    mostrarMensajeEn("mensaje", e.message, "error");
  }
}

renderCarrito();
iniciarCamara();
</script>

</body>
</html>
