<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesion</title>
<meta name="description" content="Sistema de inventario y ventas de la Tienda Comunal">

<!-- Meta para que al compartir el link se vea el logo y el nombre de la tienda -->
<meta property="og:type" content="website">
<meta property="og:title" content="TIENDA COMUNAL GC2026">
<meta property="og:description" content="Sistema de inventario y ventas de la Tienda Comunal">
<meta property="og:image" content="https://tienda-comunal.onrender.com/img/logoL.png">
<meta property="og:url" content="https://tienda-comunal.onrender.com/login">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="TIENDA COMUNAL GC2026">
<meta name="twitter:description" content="Sistema de inventario y ventas de la Tienda Comunal">
<meta name="twitter:image" content="https://tienda-comunal.onrender.com/img/logoL.png">

<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div class="login-page">
  <div class="login-fondo"></div>
  <div class="login-wrap">
    <div class="login-box">
      <img class="login-logo" src="img/logoL.png" alt="Logo de la tienda">
    
      <div class="card" id="loginCard">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Contrasena">
        <button class="btn btn-primary" id="btnLogin" onclick="login()">Iniciar sesion</button>
        <div id="loginMsg"></div>
      </div>
    </div>
  </div>
  <footer class="login-footer">
    <span>Gobierno Comunitario 2026</span>
    <a href="https://ceroxnueve.com/" target="_blank">Powered By: <strong>CERO NUEVE</strong></a>
  </footer>
</div>

<script src="dashboard.js"></script>
<script>
// Si ya hay sesion, no tiene sentido mostrar el login de nuevo
if (getToken()) {
  window.location.href = "dashboard";
}

// Si llegamos aca porque cerrarSesionPorTokenInvalido() nos mando (token
// vencido/invalido a mitad de uso), mostramos el porque en vez de dejar
// que parezca un login normal sin explicacion.
const mensajePendiente = localStorage.getItem("mensajeLogin");
if (mensajePendiente) {
  document.getElementById("loginMsg").innerHTML = `<div class="msg error"><i class="bi bi-exclamation-circle-fill"></i><span>${mensajePendiente}</span></div>`;
  localStorage.removeItem("mensajeLogin");
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msgDiv = document.getElementById("loginMsg");
  const btn = document.getElementById("btnLogin");
  const textoOriginal = btn.innerHTML;

  btn.disabled = true;
  btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Ingresando...';

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) throw new Error((await res.json()).mensaje || "Error al iniciar sesion");

    const data = await res.json();
    localStorage.setItem("token", data.token);
    localStorage.setItem("nombre", data.nombre || "");
    localStorage.setItem("roles", JSON.stringify(data.roles || []));
    window.location.href = "dashboard";
  } catch (e) {
    msgDiv.innerHTML = `<div class="msg error"><i class="bi bi-exclamation-circle-fill"></i><span>${e.message}</span></div>`;
    btn.disabled = false;
    btn.innerHTML = textoOriginal;
  }
}
</script>

</body>
</html>
