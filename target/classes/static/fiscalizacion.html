<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiscalizacion</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://unpkg.com/xlsx-js-style/dist/xlsx.bundle.js"></script>
</head>
<body>

<div class="app">
  <div id="fondoSidebarMovil" class="fondo-sidebar-movil"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header"><i class="bi bi-shop"></i> Tienda</div>
    <nav class="sidebar-nav">
      <a href="dashboard" data-pagina="inicio">Inicio</a>

      <button class="grupo-toggle" data-grupo="abastecimiento" data-solo-admin="1" onclick="toggleGrupo('abastecimiento')">

      </button>
      <div class="grupo-links oculto" id="grupo-abastecimiento" data-grupo="abastecimiento">
        <a href="proveedores" data-pagina="proveedores" data-solo-admin="1">Proveedores</a>
        <a href="compras" data-pagina="compras" data-solo-admin="1">Compras</a>
      </div>

      <button class="grupo-toggle" data-grupo="reportes" data-solo-admin="1" onclick="toggleGrupo('reportes')">
        <span>Reportes</span><span class="grupo-flecha">▾</span>
      </button>
      <div class="grupo-links oculto" id="grupo-reportes" data-grupo="reportes">
        <a href="historial-ventas" data-pagina="historial-ventas" data-solo-admin="1">Historial de ventas</a>
        <a href="estadisticas" data-pagina="estadisticas" data-solo-admin="1">Estadisticas</a>
        <a href="fiscalizacion" data-pagina="fiscalizacion" data-solo-admin="1">Fiscalizacion</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="nombre" id="sidebarNombre"></div>
      <div class="rol" id="sidebarRol"></div>
      <button onclick="logout()">Cerrar sesion</button>
    </div>
  </aside>

  <div class="contenido">
    <div class="topbar">
      <button id="btnHamburguesa" class="btn-hamburguesa"><i class="bi bi-list"></i></button>
      <h1>Informe de Fiscalizacion Mensual</h1>
    </div>
    <div class="pagina">

      <div class="card">
        <label class="campo">Desde</label>
        <input type="date" id="fiscalDesde">
        <label class="campo">Hasta</label>
        <input type="date" id="fiscalHasta">
        <button onclick="cargarFiscalizacion()">Generar informe</button>
        <button class="secundario" onclick="descargarExcel()"><i class="bi bi-download"></i> Descargar Excel</button>
      </div>

      <div id="fiscalResultado">

        <h1>DATOS DE FISCALIZACION</h1>
        
      </div>

    </div>
  </div>
</div>

<script src="dashboard.js"></script>
<script>
initSidebar("fiscalizacion");

let ultimoReporte = null;
let ultimosGastos = [];
let ultimasFechas = { desde: "", hasta: "" };

const ENCABEZADOS_FISCALIZACION = [
  "Producto", "Codigo", "Saldo anterior", "Entrada del mes", "Total",
  "Existencia actual", "Valor existencia", "Cant. vendida", "Salida c/ganancia",
  "Salida p/mercado", "Prod. neto existente", "Ganancia"
];

function primerDiaMesISO() {
  const d = new Date();
  d.setDate(1);
  return fechaLocalISO(d);
}

function hoyISO() {
  return fechaLocalISO(new Date());
}

function prepararFechas() {
  const desde = document.getElementById("fiscalDesde");
  const hasta = document.getElementById("fiscalHasta");
  if (!desde.value) desde.value = primerDiaMesISO();
  if (!hasta.value) hasta.value = hoyISO();
}

function formatoNumero(valor) {
  return Number(valor).toLocaleString("es", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function sumaCampo(items, campo) {
  return items.reduce((acc, it) => acc + Number(it[campo]), 0);
}

// Totales generales (todas las categorias juntas), mapeados a los campos que
// ya calcula el backend por producto:
//   Productos existentes -> valorExistencia (existencia actual a precio de venta)
//   Productos vendidos    -> salidaConGanancia (lo vendido, a precio de venta)
//   Productos de compras  -> salidaPrecioMercado (lo vendido, pero a precio de compra/costo)
//   Productos netos       -> productoNetoExistentes (saldo anterior, a precio de compra/costo)
function calcularTotalesGenerales(porCategoria) {
  const todos = Object.values(porCategoria).flat();
  return {
    existentesValor: sumaCampo(todos, "valorExistencia"),
    existentesUnidades: sumaCampo(todos, "existenciaActual"),
    vendidos: sumaCampo(todos, "salidaConGanancia"),
    deCompras: sumaCampo(todos, "salidaPrecioMercado"),
    netos: sumaCampo(todos, "productoNetoExistentes")
  };
}

async function cargarFiscalizacion() {
  prepararFechas();
  const desde = `${document.getElementById("fiscalDesde").value}T00:00:00`;
  const hasta = `${document.getElementById("fiscalHasta").value}T23:59:59`;
  const div = document.getElementById("fiscalResultado");
  div.innerHTML = `<p style="color:var(--muted)">Generando informe...</p>`;

  try {
    const [r, gastos] = await Promise.all([
      apiFetch(`/reportes/fiscalizacion?desde=${desde}&hasta=${hasta}`),
      apiFetch(`/gastos?desde=${desde}&hasta=${hasta}`)
    ]);
    const categorias = Object.keys(r.porCategoria || {});

    ultimoReporte = r;
    ultimosGastos = gastos;
    ultimasFechas = {
      desde: document.getElementById("fiscalDesde").value,
      hasta: document.getElementById("fiscalHasta").value
    };

    if (categorias.length === 0) {
      div.innerHTML = `<p style="color:var(--muted)">Sin productos activos para mostrar</p>`;
      return;
    }

    const totales = calcularTotalesGenerales(r.porCategoria);

    let html = `
      <div class="seccion-titulo">Resumen general</div>
      <div class="card">
        <div class="item">
          <div>Total de ventas del periodo <small>bruto, sin restar costo ni gastos</small></div>
          <strong style="color:#1d709d">$${formatoNumero(r.totalVentasBruto)}</strong>
        </div>
        <div class="item">
          <div>Total de productos existentes</div>
          <strong style="color:var(--accent)">$${formatoNumero(totales.existentesValor)} · ${totales.existentesUnidades} unidades</strong>
        </div>
        <div class="item">
          <div>Total de productos vendidos</div>
          <strong>$${formatoNumero(totales.vendidos)}</strong>
        </div>
        <div class="item">
          <div>Total de productos de compras</div>
          <strong>$${formatoNumero(totales.deCompras)}</strong>
        </div>
        <div class="item">
          <div>Total de productos netos</div>
          <strong>$${formatoNumero(totales.netos)}</strong>
        </div>
        <div class="item" style="border-bottom:none">
          <div><strong>Ganancia total del periodo</strong></div>
          <strong>$${formatoNumero(r.totalGeneralGanancia)}</strong>
        </div>
      </div>`;

    html += renderGastosYCierre(r, gastos);

    html += renderProductosPorPeso(r.productosPorPeso || []);

    html += `<div class="seccion-titulo">Informe por categorias</div>`;
    categorias.forEach(categoria => {
      const items = r.porCategoria[categoria];
      const unidadesCategoria = sumaCampo(items, "existenciaActual");
      const valorSiVendidoCategoria = sumaCampo(items, "valorExistencia");
      html += `
        <div class="card">
          <h2>Categoria: ${categoria}</h2>
          <p style="color:var(--muted); font-size:13px; margin:-4px 0 12px">
            ${unidadesCategoria} unidades en existencia ·
            valor si se vendiera todo: $${formatoNumero(valorSiVendidoCategoria)}
          </p>
          <div class="tabla-scroll">
            <table class="tabla-reporte">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th>Codigo</th>
                  <th><span class="chip col-azul">Saldo anterior</span></th>
                  <th><span class="chip col-azul">Entrada del mes</span></th>
                  <th><span class="chip col-azul">Total</span></th>
                  <th><span class="chip col-verde">Existencia actual</span></th>
                  <th><span class="chip col-verde">Valor existencia</span></th>
                  <th><span class="chip col-tomate">Cant. vendida</span></th>
                  <th><span class="chip col-tomate">Salida c/ganancia</span></th>
                  <th><span class="chip col-tomate">Salida p/mercado</span></th>
                  <th><span class="chip col-azul">Prod. neto existente</span></th>
                  <th><span class="chip col-verde">Ganancia</span></th>
                </tr>
              </thead>
              <tbody>`;

      let subtotalGanancia = 0;
      items.forEach(it => {
        subtotalGanancia += it.sumaGanancia;
        html += `
          <tr>
            <td>${it.nombre}</td>
            <td>${it.codigoBarras}</td>
            <td>${it.saldoAnterior}</td>
            <td>${it.entradaDelMes}</td>
            <td>${it.total}</td>
            <td>${it.existenciaActual}</td>
            <td>$${formatoNumero(it.valorExistencia)}</td>
            <td>${it.cantidadVendida}</td>
            <td>$${formatoNumero(it.salidaConGanancia)}</td>
            <td>$${formatoNumero(it.salidaPrecioMercado)}</td>
            <td>$${formatoNumero(it.productoNetoExistentes)}</td>
            <td>$${formatoNumero(it.sumaGanancia)}</td>
          </tr>`;
      });

      html += `
              </tbody>
              <tfoot>
                <tr>
                  <td colspan="11">Subtotal ganancia — ${categoria}</td>
                  <td>$${formatoNumero(subtotalGanancia)}</td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>`;
    });

    div.innerHTML = html;
  } catch (e) {
    div.innerHTML = `<div class="msg error">${e.message}</div>`;
  }
}

// ---------- GASTOS DEL PERIODO Y CIERRE DE CAJA ----------
function renderGastosYCierre(r, gastos) {
  const totalGastos = gastos.reduce((acc, g) => acc + Number(g.monto), 0);

  let filasGastos = gastos.map(g => `
    <div class="item">
      <div>${g.descripcion}<small>${new Date(g.fecha).toLocaleDateString("es")}</small></div>
      <div class="item-acciones">
        <span>$${formatoNumero(g.monto)}</span>
        <button class="secundario" onclick="eliminarGasto(${g.id})"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>`).join("");

  if (gastos.length === 0) {
    filasGastos = `<p style="color:var(--muted); font-size:13px">Sin gastos registrados en este rango</p>`;
  }

  return `
    <div class="seccion-titulo">Gastos del periodo</div>
    <div class="card">
      <input type="text" id="gastoDescripcion" placeholder="Ej: Pago a trabajador">
      <input type="number" min="0.01" step="0.01" id="gastoMonto" placeholder="Monto">
      <button onclick="agregarGasto()">Agregar gasto</button>
      <div id="mensajeGastos"></div>
      ${filasGastos}
      <div class="item" style="border-bottom:none; font-weight:700">
        <div>Total de gastos</div>
        <div>$${formatoNumero(totalGastos)}</div>
      </div>
    </div>

    <div class="seccion-titulo">Cierre de caja</div>
    <div class="card">
      <div class="item">
        <div>Ganancia del periodo</div>
        <strong>$${formatoNumero(r.totalGeneralGanancia)}</strong>
      </div>
      <div class="item">
        <div>Total de gastos</div>
        <strong>-$${formatoNumero(r.totalGastos)}</strong>
      </div>
      <div class="item">
        <div>q (ganancia − gastos)</div>
        <strong>$${formatoNumero(r.q)}</strong>
      </div>
      <div class="item">
        <div>Deudas pendientes (todos los deudores)</div>
        <strong>+$${formatoNumero(r.deudasPendientes)}</strong>
      </div>
      <div class="item">
        <div>Ingreso en efectivo <small>conteo fisico, se ingresa a mano</small></div>
        <input type="number" min="0" step="0.01" id="cierreIngresoEfectivo"
               style="width:120px; margin-bottom:0; text-align:right"
               oninput="actualizarCierreDeCaja()" placeholder="0.00">
      </div>
      <div class="item" style="border-bottom:none">
        <div><strong>Ingresa al siguiente mes</strong></div>
        <strong id="cierreSiguienteMes" class="total-general">$${formatoNumero(Number(r.q) + Number(r.deudasPendientes))}</strong>
      </div>
    </div>`;
}

// ---------- PRODUCTOS POR PESO (ej: carnes) ----------
// Quedan afuera del "Informe por categorias" porque no tienen kardex (no se
// les lleva stock exacto) - su ganancia se calcula directo de las ventas y
// ya esta sumada dentro de "Ganancia total del periodo" de arriba.
function renderProductosPorPeso(productos) {
  if (productos.length === 0) return "";

  const filas = productos.map(p => `
    <tr>
      <td>${p.producto}</td>
      <td>${Number(p.pesoVendido).toFixed(2)} lb</td>
      <td>$${formatoNumero(p.ingresoTotal)}</td>
      <td>${p.gananciaEstimada != null ? "$" + formatoNumero(p.gananciaEstimada) : "N/D"}</td>
    </tr>`).join("");

  return `
    <div class="seccion-titulo">Productos por peso (ej. carnes)</div>
    <div class="card">
      <p style="color:var(--muted); font-size:13px; margin:-4px 0 12px">
        No llevan stock exacto (se venden por libra/peso) - la ganancia sale de comparar lo
        vendido contra el precio de compra configurado en el producto.
      </p>
      <div class="tabla-scroll">
        <table class="tabla-reporte">
          <thead>
            <tr>
              <th>Producto</th>
              <th><span class="chip col-azul">Peso vendido</span></th>
              <th><span class="chip col-tomate">Ingreso</span></th>
              <th><span class="chip col-verde">Ganancia estimada</span></th>
            </tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>`;
}

function actualizarCierreDeCaja() {
  if (!ultimoReporte) return;
  const ingreso = Number(document.getElementById("cierreIngresoEfectivo").value) || 0;
  const siguienteMes = Number(ultimoReporte.q) + ingreso + Number(ultimoReporte.deudasPendientes);
  document.getElementById("cierreSiguienteMes").innerText = `$${formatoNumero(siguienteMes)}`;
}

async function agregarGasto() {
  const descripcion = document.getElementById("gastoDescripcion").value.trim();
  const monto = parseFloat(document.getElementById("gastoMonto").value);

  if (!descripcion || !monto || monto <= 0) {
    mostrarMensajeEn("mensajeGastos", "Completa la descripcion y un monto valido", "error");
    return;
  }

  try {
    await apiFetch("/gastos", { method: "POST", body: JSON.stringify({ descripcion, monto }) });
    await cargarFiscalizacion();
  } catch (e) {
    mostrarMensajeEn("mensajeGastos", e.message, "error");
  }
}

async function eliminarGasto(id) {
  if (!confirm("¿Eliminar este gasto?")) return;
  try {
    await apiFetch(`/gastos/${id}`, { method: "DELETE" });
    await cargarFiscalizacion();
  } catch (e) {
    alert(e.message);
  }
}

// ---------- DESCARGAR EXCEL (una sola hoja, todos los productos, con columna Categoria) ----------
const NUM_COLUMNAS_EXCEL = ENCABEZADOS_FISCALIZACION.length + 1; // + Categoria

function aplicarEstiloFila(hoja, filaIndex, estilo) {
  for (let c = 0; c < NUM_COLUMNAS_EXCEL; c++) {
    const addr = XLSX.utils.encode_cell({ r: filaIndex, c });
    if (!hoja[addr]) hoja[addr] = { t: "s", v: "" };
    hoja[addr].s = estilo;
  }
}

// Columnas del bloque de datos (0=Categoria, 1=Producto, 2=Codigo quedan en
// blanco a proposito, son nombres/identificadores, no numeros destacables).
const COLUMNAS_AZUL = [3, 4, 5, 11];    // Saldo anterior, Entrada del mes, Total, Prod. neto existente
const COLUMNAS_VERDE = [6, 7, 12];      // Existencia actual, Valor existencia, Ganancia
const COLUMNAS_TOMATE = [8, 9, 10];     // Cant. vendida, Salida c/ganancia, Salida p/mercado

function aplicarColorColumnas(hoja, filaIndex, columnas, colorHex) {
  columnas.forEach(c => {
    const addr = XLSX.utils.encode_cell({ r: filaIndex, c });
    if (!hoja[addr]) hoja[addr] = { t: "s", v: "" };
    hoja[addr].s = { fill: { fgColor: { rgb: colorHex } } };
  });
}

function descargarExcel() {
  if (!ultimoReporte || Object.keys(ultimoReporte.porCategoria || {}).length === 0) {
    alert("Primero genera el informe (no hay datos para descargar)");
    return;
  }

  const totales = calcularTotalesGenerales(ultimoReporte.porCategoria);

  const filas = [
    ["Informe de Fiscalizacion Mensual"],
    ["Desde", ultimasFechas.desde, "Hasta", ultimasFechas.hasta],
    [],
    ["Total de ventas del periodo (bruto)", ultimoReporte.totalVentasBruto],
    ["Total de productos existentes", totales.existentesValor, "Unidades", totales.existentesUnidades],
    ["Total de productos vendidos", totales.vendidos],
    ["Total de productos de compras", totales.deCompras],
    ["Total de productos netos", totales.netos],
    ["Ganancia total del periodo", ultimoReporte.totalGeneralGanancia]
  ];
  const filasResumenGeneral = [3, 4, 5, 6, 7, 8];

  // Productos por peso (ej: carnes): mismo bloque que se ve en pantalla,
  // aparte del informe por categoria porque no tienen kardex.
  const filasPorPeso = [];
  const productosPorPeso = ultimoReporte.productosPorPeso || [];
  if (productosPorPeso.length > 0) {
    filas.push([]);
    filas.push(["PRODUCTOS POR PESO (ej: carnes)"]);
    filasPorPeso.push(filas.length - 1);
    filas.push(["Producto", "Peso vendido (lb)", "Ingreso", "Ganancia estimada"]);
    filasPorPeso.push(filas.length - 1);
    productosPorPeso.forEach(p => {
      filas.push([p.producto, p.pesoVendido, p.ingresoTotal, p.gananciaEstimada != null ? p.gananciaEstimada : "N/D"]);
    });
  }

  filas.push([]);
  filas.push(["Categoria", ...ENCABEZADOS_FISCALIZACION]);
  const filaEncabezados = filas.length - 1; // fila "Categoria, Producto, ..." recien agregada arriba

  const filasSubtotal = [];
  const filasDatos = [];
  Object.entries(ultimoReporte.porCategoria).forEach(([categoria, items]) => {
    let subtotalGanancia = 0;

    filas.push([`${categoria} — ${sumaCampo(items, "existenciaActual")} unidades en existencia,`
      + ` valor si se vendiera todo: ${sumaCampo(items, "valorExistencia").toFixed(2)}`]);
    const filaResumenCategoria = filas.length - 1;

    items.forEach(it => {
      subtotalGanancia += it.sumaGanancia;
      filas.push([
        categoria, it.nombre, it.codigoBarras, it.saldoAnterior, it.entradaDelMes, it.total,
        it.existenciaActual, it.valorExistencia, it.cantidadVendida,
        it.salidaConGanancia, it.salidaPrecioMercado, it.productoNetoExistentes, it.sumaGanancia
      ]);
      filasDatos.push(filas.length - 1);
    });

    filas.push(["", `Subtotal ganancia — ${categoria}`, "", "", "", "", "", "", "", "", "", "", subtotalGanancia]);
    filasSubtotal.push(filas.length - 1);
    filasSubtotal.push(filaResumenCategoria);
  });

  filas.push([]);
  filas.push(["", "GANANCIA TOTAL DEL PERIODO", "", "", "", "", "", "", "", "", "", "", ultimoReporte.totalGeneralGanancia]);
  const filaTotalGeneral = filas.length - 1;

  const hoja = XLSX.utils.aoa_to_sheet(filas);

  // Ancho por columna (si no, Excel corta el texto de encabezados largos
  // como "Salida c/ganancia" o "Prod. neto existente").
  hoja["!cols"] = [
    { wch: 22 }, // Categoria
    { wch: 24 }, // Producto
    { wch: 16 }, // Codigo
    { wch: 14 }, // Saldo anterior
    { wch: 15 }, // Entrada del mes
    { wch: 9 },  // Total
    { wch: 16 }, // Existencia actual
    { wch: 15 }, // Valor existencia
    { wch: 13 }, // Cant. vendida
    { wch: 17 }, // Salida c/ganancia
    { wch: 16 }, // Salida p/mercado
    { wch: 19 }, // Prod. neto existente
    { wch: 11 }, // Ganancia
  ];

  // Paleta minimalista (tonos muy suaves, casi blancos) para que se note el
  // agrupamiento sin ser un bloque de color fuerte - el vendedor igual
  // distingue titulo / encabezados / subtotal / total por el tono y el bold.
  const GRIS_CLARO = "F2F2F7";
  const VERDE_PALIDO = "F1F8F4";
  const CREMA_PALIDO = "FFFBF0";
  const AZUL_DATOS = "EFF6FF";
  const VERDE_DATOS = "F0FDF4";
  const TOMATE_DATOS = "FFF4F0";
  const BORDE_SUAVE = { bottom: { style: "thin", color: { rgb: "E5E5EA" } } };

  // En cada fila de producto: Categoria/Producto/Codigo quedan en blanco, y
  // las columnas de numeros/valores destacables se colorean por grupo.
  filasDatos.forEach(fila => {
    aplicarColorColumnas(hoja, fila, COLUMNAS_AZUL, AZUL_DATOS);
    aplicarColorColumnas(hoja, fila, COLUMNAS_VERDE, VERDE_DATOS);
    aplicarColorColumnas(hoja, fila, COLUMNAS_TOMATE, TOMATE_DATOS);
  });

  aplicarEstiloFila(hoja, 0, { font: { bold: true, sz: 14, color: { rgb: "1D1D1F" } } }); // titulo
  filasResumenGeneral.forEach(fila =>
    aplicarEstiloFila(hoja, fila, { font: { bold: true, color: { rgb: "1D1D1F" } }, fill: { fgColor: { rgb: VERDE_PALIDO } } })
  );
  aplicarEstiloFila(hoja, filaEncabezados, { // encabezados
    font: { bold: true, color: { rgb: "1D1D1F" }, sz: 11 },
    fill: { fgColor: { rgb: GRIS_CLARO } },
    border: BORDE_SUAVE
  });
  filasSubtotal.forEach(fila =>
    aplicarEstiloFila(hoja, fila, { font: { bold: true, color: { rgb: "1D1D1F" } }, fill: { fgColor: { rgb: CREMA_PALIDO } } })
  );
  aplicarEstiloFila(hoja, filaTotalGeneral, { font: { bold: true, sz: 12, color: { rgb: "1D1D1F" } }, fill: { fgColor: { rgb: VERDE_PALIDO } } });
  filasPorPeso.forEach(fila =>
    aplicarEstiloFila(hoja, fila, { font: { bold: true, color: { rgb: "1D1D1F" } }, fill: { fgColor: { rgb: TOMATE_DATOS } } })
  );

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, hoja, "Fiscalizacion");

  XLSX.writeFile(wb, `fiscalizacion_${ultimasFechas.desde}_a_${ultimasFechas.hasta}.xlsx`);
}

cargarFiscalizacion();
</script>
